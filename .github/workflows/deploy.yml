name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# let the deploy job publish to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; don't cancel a run that's mid-publish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # tests/test_search_parity.py runs the real app.js in Node
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build (fails on any invalid YAML or broken reference)
        run: python build.py

      - name: Test
        run: python -m pytest -q

      # Pages runs Jekyll unless told not to; it would skip _underscore paths
      - name: Disable Jekyll
        run: touch site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # only publish from main; PRs still get built and tested above
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4