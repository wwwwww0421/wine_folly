# Food tag vocabulary. Grouped by data/food-categories.yaml — i.e. by *why*
# a dish pairs the way it does, not by cuisine. Tag ids/aliases are the
# search-bridge food-to-wine relies on; category is display grouping only.

# --- red-meat-steak: seared, high-protein cuts want tannin ---
- id: steak
  label: Steak
  category: red-meat-steak
  aliases: [ribeye, filet mignon, strip steak, porterhouse, flank steak, skirt steak, t-bone]
- id: grilled
  label: Grilled & charred
  category: red-meat-steak
  aliases: [grilled, char grilled, kebab, souvlaki]
- id: exotic-lean-meats
  label: Exotic & lean game meats
  category: red-meat-steak
  aliases: [ostrich, venison steak, wild boar, kangaroo, bison, elk]

