notes: >
  An aromatic white variety that can produce white wines ranging in style from bone-dry to very sweet. Germany is the world's most important producer of Riesling.

  Germany Riesling with taste of apricot, meyer lemon, beeswax, petroleum, wet slate.
  Alsace, France Riesling with taste of green apple, lime, lemon, smoke, thai basil.
  South Australia Riesling with taste of lime peel, green apple, green papaya, jasmine, diesel.
