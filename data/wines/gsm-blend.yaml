notes: >
  GSM stands for Grenache, Syrah, and Mourvèdre. These 3 grape create the base of Southern France and Northern Spain's most important red wine blends.

  Côte du Rhône GSM Blend tastes of black olive, dried cranberry, dried herbs, cinnamon, leather.
  Paso Robles, CA GSM Blend tastes of black raspberry, mission fig, gingersnap, bacon fat, camphor.
  Provence Rosé tastes of strawberry, honeydew melon, pink peppercorn, celery, orange peel.
