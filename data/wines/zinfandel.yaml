notes: >
  A fruit-forward yet bold red that's loved for its jammy fruit and smoky, exotic spice notes. Originally from Croatia, Zinfandel is related to Croatia's #1 red, Plavic Mali.

  Puglia, Italy Zinfandel with flavours of strawberry, leather, candied currant, dried herbs, spiced orange.
  Lodi, California region with flavours of respberry jam, peach preserves, blackberry bramble, hickory, star anise.
  North Coast, California, region with flavour of blackberry, black plum, crushed gravel, allspice, white pepper.
