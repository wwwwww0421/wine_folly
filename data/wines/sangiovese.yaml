notes: >
  Sangiovese is Italy's most planted grape and the key variety in Tuscany's renowned Chianti. It's sensitive, tasting quite different depending on where it grows.

  Chianti, Tuscany classifies its wines based on region, quality and ageing specifications:
  - Gran Selezione: 2.5 years
  - Riserva: 2 years
  - Superiore: 1 year
  - Ch. Classico, Ch. Colli Fiorentini, Ch. Rufina: 1 year
  - Ch. Montespertoli: 9 months
  - Chianti and others: 6 months

  Montalcino Tuscany region:
  - Brunello di Montalcino Riserva: Aged 2 years in oak, and 4 more years after that.
  - Burnello di Montalcino: Aged 2 years in oak, and 3 additional years after that.
  - Rosso di Montalcino: Aged 1 year.

  Regional Names:
  - Carmignano
  - Chianti
  - Montefalco Rosso
  - Morellino di Scansano
  - Rosso Conero
  - Rosso di Monalcino
  - Torgiano Rosso
  - Vino Nobile di Montepulciano

