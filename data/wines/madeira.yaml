notes: >
  These oxidised and fortified dessert wines are made exclusively on Portugese island of Madeira. Wines are incredibly stable and some will age over 100 years.

  Styles:
  - Rainwater: A common style blended with Tinta Negra Mole.
  - Sercial: The lightest style made with Sercial grapes.
  - Verdelho: A light and aromatic style made with Verdelho grapes.
  - Bual / Boal: The second sweetest style made with Malvasia grapes.
  - Malmsey: The sweetest style made with Malvasia grapes.

  Sweetness Level:
  - Extra Dry: 0-50g/L RS
  - Dry: 50-65g/L RS
  - Medium Dry: 65-80g/L RS
  - Med. Rich / Sweet: 80-96g/L RS
  - Rich / Sweet: 96+g/L RS

  Production Style:
  - Canteiro Method: Wine ages naturally in barrels or large glass bottles in a warm room or under the sun.
  - Estufa Method: Wine is heated in tanks for a short period.

  Vintage Styles:
  - Colheita / Harvest: A single-vintage Madeira aged 5+ years. Typically a single grape variety.
  - Solera: A multi-vintage blend by Canteiro. Pretty Rare.
  - Frasqueira / Garrafeira: Single vintage aged 20+ years by Canteiro method. Very rare.

  Non-Vintage Styles:
  - Finest / Choice / Select: Aged 3 years by Estufa. Affordable choice for cooking wines. Tinta Negra Mole.
  - Rainwater: Medium Dry style aged 3 years. Great affordable cooking wine. Tinta Negra Mole.
  - 5-year / Reserve / Mature: Aged 5-10 years. Sipping quality.
  - 10-year / Special Reserve: Aged 10-15 years by Canteiro. Typically a single variety. High quality.
  - 15-year / Extra Reserve: Aged 15-20 years by Canteiro. Typically a single variety. Very high quality.
