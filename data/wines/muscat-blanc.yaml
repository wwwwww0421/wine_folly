notes: >
  An ancient aromatic white variety originally from Greece that's available in all styles from dry to sweet, still to sparkling, and even fortified.

  Msocato d'Asti taste of mandarin orange, honeysuckle, meyer lemon, rose petal, vanilla bean.
  Alsace Muscat taste of fresh grape, perfume, lemongrass, coriander, nutmeg.
  Rutherglen Muscat taste of caramel, candied cherry, coffee, sassafras, vanilla bean.
