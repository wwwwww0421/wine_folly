notes: >
  Cava is the premier sparkler of Spain. It uses a similar quality tier system to Champagne, but champions several indigenous Spanish grape varieties.
  Lees: are dead yeast particles and they increase texture and creaminess.
  Cava - Aged for minimum of 9months on the lees.
  Cava Reserva - Aged for a minimum of 15months on the lees.
  Cava Gran Reserva - Aged for a minimum 30months on the lees and vintage dated.
