notes: >
  Meaning `wild grape`. A family of 8 closely related grapes native to Italy. Wines are typically sparkling and range from dry to sweet.
  Lambrusco di Sorbara tastes of orange blossom, mandarin orange, cherry, violet, watermelon.
  Lambrusco Grasparossa tastes of blackcurrant, blueberry, oregano, cocoa powder, and cultured cream.

  Secco - Dry wines with floral or herbal notes.
  Semisecco - Just off-dry styles with more fruitiness.
  Amabile and Dolce - Noticeably sweet styles, great for pairing with dessert, particularly milk chocolate.
also_try: [schiava, brachetto-d-acqui, zweigelt, concord]