notes: >
  A unique-tasting wine wiht strong herbaceous flavours that are derived from compounds called methoxypyrazines (also found in peppers).

  Loire Valley France region Sauvignon Blanc with flavours of lime, gooseberry, grapefruit, slate, smoke.
  New Zealand with flavours of passion fruit, kiwi, pea shoot, jasmine, ripe pear.
  North Coast, California flavours of white peach, matcha powder, lemongrass, buttered bread, saline.
