notes: >
  Italy's most popular sparkling wine is created with Glera grapes grown in Veneto and Friuli-venezia Giulia. The best Prosecco wines come from Valdobiaddene!

  Quality Level:
  1. Valdobbiadene Superiore di Cartizze DOCG: A micro region of just 265 acres just outside Valdobbiadene.
  2. Prosecco Conegliano Valdobbiadene Superiore Rive DOCG: Wines from 43 communes or vineyards within Conegliano-Valdobbiadene.
  3. Colli Asolani DOCG: Another smaller hillside region across the river from the Conegliano-Valdobbiadene region.
  4. Prosecco Congegliano Valdobbiadene Superiore DOCG: A smaller, more focused growing area between Valdobbiadene and Conegliano in the hills.
  5. Prosecco DOC: Basic quality Prosecco made in 9 provinces from Veneto and Friuli-Venezia Giulia regions.
