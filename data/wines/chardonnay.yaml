notes: >
  One of the world's most popular grapes. Chardonnay is made in a wide range of styles from sparkling Blanc de Blancs to rich white wines aged in oak.
  Chablis, France region flavours quince, starfruit, lime peel, white blossom, chalk.
  Santa Barbara region flavours yellow apple, pineapple, lemon zest, pie crust, nutmeg.
  Western Australia region flavours white peach, tangerine, honeysuckle, vanilla, lemon curd.
