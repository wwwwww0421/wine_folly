notes: >
  "A red blend that's primarily Cabernet Sauvignon and Merlot along with several other grape varieties that originated in Bordeaux, France.
  Bordeaux region's Bordeaux-blend tend to have flavours of blackcurrant, anise, tobacco leaf, plum sauce, baking spices.
  Western Australia region's tend to have flavours of redcurrant, black cherry, sage, coffee, bay leaf.
  Bolgheri, Tuscany region's tend to have flavours of black cherry, blackberry, sandalwood, leather, anise.
  "
