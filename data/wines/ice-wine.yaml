notes: >
  A late-harvest sweet wine that can only be made when grapes naturally freeze in the vineyard. Popular varieties include Riesling, Vidal Blanc, and Cabernet Franc.
  To be labelled Ice Wine, grapes must be picked and pressed while frozen naturally. This only happens in cool climates where temperatures get below -7ºC in the late-harvest period.
  Because the juice is so sweet, fermentations are quite long, taking about 2-6 months.
  Ice Wines have low alcohol and high sweetness 10% ABV and 160-220g/L residual sugar.
also_try: [sauternes, furmint, late-harvest-riesling]