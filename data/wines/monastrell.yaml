notes: >
  A deeply bold, smokey red wine found in abundance in Central Spain. It's known as Mourvèdre in Southern France, where it's an essential grape in the Rhône / GSM Blend.

  Bandol, France with tastes of black plum, roasted meat, black pepper, cocoa powder, herbs de provence.
  South-Eastern Spain with tastes of Blackberry, black raisin, mocha, tobacco smoke, black pepper.
  BAndol Rosé taste like strawberry, white peach, white pepper, white blossom and violet.
