notes: >
  Merlot is loved for its boisterous black cherry flavours, supply tannins, and smokey or chocolaty finish. It's often found in a Bordeaux blend with Cabernet Franc.

  Right Bank Bordeaux region tastes cherry, new leather, cedar, incense, bay leaf
  Columbia Valley region tastes black cherry, boysenberry, chocolate cream, violet, mint
  North Coast region tastes sweet cherry, sugar plum, baking chocolate, vanilla, desert dust
