notes: >
  One of Italy's top reds made famous by the Barolo region of Piedmont. It's here where wines deliver both delicate aromas and rigorous tannins the grape is famour for.

  Southern Piedmont region taste of black cherry, spice cake / tar, rose, liquorice, carob.
  Norhtern Piedmont region taste of sour cherry, rose hip, tobacco leaf, leather, black tea.
  Valtellina region taste of cranberry, hibiscus, peony, dried herbs, and clove.
