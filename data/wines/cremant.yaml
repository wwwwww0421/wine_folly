notes: >
  A group of sparkling wines found mostly in France made using the traditional sparkling wine method (same as Champagne), but often specialising in a regional variety.
  Crémant D'Alsace - Pinot Noir, Pinot Blanc, Pinot Gris, Chardonnay, etc.
  Crémant De Limoux - Chardonnay, Chenin Blanc, Mauzac, etc.
  Crémant De Bourgogne - Chardonnay, Pinot Noir, etc.
  Crémant De Loire - Chenin Blanc, Cabernet Franc, Pinot Noir.
  Crémant De Bourdeaux - Merlot, etc.
  Crémant De Die - Clairette
  Crémant De Savoie - Jacquère, Altesse, Chasselas, etc.
  Crémant Du Jura - Chardonnay, Pinot Noir, Poulsard, etc.
