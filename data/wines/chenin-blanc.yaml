notes: >
  Chenin Blanc has diversity of styles from lean, dry whites and aromatic sparklers to sweet golden nectars and rich balanced brandy.
  Rich and Off-Dry Chenin Blanc flavours asian pear, yellow apple, honeysuckle, orange blossom, allspice.
  Lean and Dry Chenin Blanc flavours quince, pear, pomelo, ginger, tarragon.
  Sparkling Chenin Blanc flavours honeydew melon, lemon, jasmine, lemon curd, cream.
