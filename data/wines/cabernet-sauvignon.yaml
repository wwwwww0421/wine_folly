notes: >
  The world's most popular wine is a natural cross between Cabernet Franc and Sauvignon Blanc that orignated in Bordeaux. Wines are concentrated and age-worthy.
  Chile region flavours have blackberry, black cherry, fig paste, baking spices, green peppercorn.
  Napa Valley, CA region have flavours of blackcurrant, pencil lead, tobacco, blackberry, mint.
  South Australia region have flavours of black plum, white pepper, currant candy, chocolate, bay leaf.
