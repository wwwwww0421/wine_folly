notes: >
  The region's most famous wine, Amarone della Valpolicella uses partially dried grapes (a process called `appasimento`) that are then fermented into a rich red wine.

  - Recioto Della Valpolicella: A dessert wine style made with the apassimento method where grapes are dried on straw mats to concentrate sugars. Features flavours of black raisin, black cherry, chocolate, clove and roasted hazelnut.
  - Amarone Della Valpolicella: A dry wine made with the apassimento method. Wines take up to 50 days to ferment. Expect flavours of black cherry, fig, sassafras, and dark chocolate.
  - Valpolicella Superiore Ripasso: Superiore Valpolicella wines blended with the leftover grape must of Amarone wine. Features cherry sauce, green peppercorn, and carob.
  - Valpolicella Superiore: Higher-quality Valpolicella grapes make more concentrated wines.
  - Valpolicella Classico: Basic-quality grape producing entry level wines. Tart cherry and ash.
