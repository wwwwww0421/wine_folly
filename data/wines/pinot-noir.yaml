# --- pairings live ON the wine ---
pairings:
  - tags: [duck]
    strength: great           # perfect | great | good
    why: "It's taste is meant for duck."
  - tags: [light-meat]
    strength: great
    why: "The taste is meant for chicken, pork and mushrooms."
notes: >
  The world's most popular light-bodied red is loved for its red fruit and spice flavours that are accentuated by a long, smooth, soft-tannin finish.
  Burgundy region taste with mushroom, cranberry, plum sauce, fruit pastille, hibiscus.
  California region taste with raspberry sauce, plum, gun smoke, vanilla, allspice.
  Cooler climate regions offer more tart fruit flavours while warmer climate regions ripe, boisterous fruit flavours.
also_try: [st-laurent, gamay, nerello-mascalese, schiava, zweigelt]