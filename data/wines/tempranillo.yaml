notes: >
  Spain's top variety, made famous by the wines of Rioja, where wines are classified by how long they age in oak. Fine Tempranillo ages 20+ years but costs a little more.

  Northern Spain Tempranillo tastes of dried cherry, sour cherry, pastrami, roasted tomato, chard.
  Spanish `Reserva` tastes of black cherry, dill, cigar box, brown sugar, fig.
  Rosé Tempranillo tastes with strawberry, white pepper, clove, tomato, and bay leaf.
