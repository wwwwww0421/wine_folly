notes: >
    Cabernet Franc is the parent grape of both Merlot and Cabernet Sauvignon. It may have originated in the Basque Country of Spain but this fact is up for debate.
    Chinon, France region's Cabernet France tend to have flavours of red pepper, red chilli flake, raspberry sauce, wet gravel, dried herbs.
    Tuscany, Italy region's have flavours of cherry, leather, strawberry, liquorice, coffee.
    Sierra Foothills, CA tend to have flavours of dried strawberry, raspberry, tobacco leaf, cedar, vanilla.
also_try: [carmenere, sangiovese, tempranillo, zinfandel, castelao]