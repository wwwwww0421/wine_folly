notes: >
  A rich, powerful, and sometimes meaty red wine that originated in Rhône Valley of France. It's the most planted grape of Australia, where it's called Shiraz.

  South Australia Syrah with flavours of blackberry sauce, fruit cake, sassafras, camphor, sweet tobacco.
  Rhône Valley, France Syrah with flavours of plum, black pepper, tobacco leaf, bacon fat, graphite.
  Chile Syrah with flavours of boysenberry, black cherry, star anise, graphite, green peppercorn.
