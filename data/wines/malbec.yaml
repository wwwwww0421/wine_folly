notes: >
  Argentina's most important variety came by way of France, where it's commonly called Côt. Wines are loved for their bold fruit flavours and smooth chocolaty finish.

  Mendoza region with taste of red plum, boysenberry, red pepper flake, prune, raspberry leaf.
  Mendoza Reserva with taste of blackberry, sugar plum, mocha, red pepper flake, sweet tobacco.
  Cahors France region with taste of red plum, dried leaves, boysenberry, iris, and cocoa powder.
