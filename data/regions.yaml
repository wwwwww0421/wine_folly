- id: burgundy
  name: Burgundy (Bourgogne)
  country: France
  climate: continental
  known_for: [pinot-noir, chardonnay]
  notes: "Terroir taken to its logical extreme; village > grape on labels."
  subregions:
    - id: chablis
      name: Chablis
      known_for: [chardonnay]
      notes: "Unoaked, steely Chardonnay from Kimmeridgian limestone."

- id: south-west-france
  name: South West France (Sud-Ouest)
  country: France
  climate: continental
  known_for: [tannat, malbec, manseng, sauvignon-blanc, fer-servadou]
  notes: "A diverse, rugged, and fiercely independent wine mosaic stretching from the Atlantic coast to the Pyrenees and the Massif Central, celebrated for producing rustic, deeply concentrated, and character-driven red, white, and sweet wines."
  subregions:
    - id: cahors
      name: Cahors
      known_for: [malbec, tannat, merlot]
      notes: "The legendary historical homeland of Malbec situated along the meandering Lot River, featuring ancient limestone plateaus and rich alluvial terraces that yield dark, structured, and age-worthy red wines with earthy elegance."

- id: muscadet-sevre-et-maine
  name: Muscadet Sèvre et Maine
  country: France
  climate: maritime
  known_for: [melon-de-bourgogne]
  notes: "The largest and most renowned cru of the Muscadet region in the eastern Loire Valley, stretching across rolling hills shaped by the Sèvre and Maine rivers, where granite, schist, and gneiss soils combined with extended aging on fine lees (*sur lie*) produce crisp, saline, and intensely textured white wines."
  subregions:
    - id: clisson
      name: Clisson (Cru Communal)
      known_for: [melon-de-bourgogne]
      notes: "A premium sub-appellation situated on warm, well-drained granite and pebble soils along the Sèvre river, yielding powerful, structured, and age-worthy Muscadet with signature notes of ripe citrus and wet stone."

- id: beaujolais
  name: Beaujolais
  country: France
  climate: continental
  known_for: [gamay, chardonnay, aligote]
  notes: "A vibrant, rolling wine region just north of Lyon, stretching from granitic northern hills to sandy southern plains, celebrated for producing juicy, fruit-forward red wines from the Gamay grape alongside crisp, mineral-driven whites."
  subregions:
    - id: morgon
      name: Morgon
      known_for: [gamay]
      notes: "One of the prestigious Beaujolais Crus, featuring iron-rich, weathered schist and decomposed volcanic rock soils (*pourri*) that yield structured, deep, and age-worthy red wines with characteristic notes of ripe stone fruit."

- id: cotes-du-rhone
  name: Côtes du Rhône
  country: France
  climate: mediterranean
  known_for: [grenache, syrah, mourvedre, viognier, marsanne, roussanne]
  notes: "France's historic and expansive regional appellation stretching along the magnificent Rhône River, famed for delivering sun-drenched, generous, and food-friendly red, white, and rosé wines defined by warm stony soils and cooling mistral winds."
  subregions:
    - id: cotes-du-rhone-villages
      name: Côtes du Rhône Villages
      known_for: [grenache, syrah, mourvedre]
      notes: "A tier of superior designated communes offering stricter yield limits and greater terroir complexity, producing deeper, more structured, and spicy red wines with excellent aging potential."

- id: bandol
  name: Bandol
  country: France
  climate: mediterranean
  known_for: [mourvedre, grenache, cinsault]
  notes: "A prestigious and rugged coastal wine appellation in Provence stretching across amphitheater-like limestone hills facing the Mediterranean Sea, where intense sunshine, protective maritime breezes, and poor, stony soils allow the late-ripening Mourvèdre grape to achieve extraordinary power, longevity, and complexity."
  subregions:
    - id: le-beausset
      name: Le Beausset
      known_for: [mourvedre, grenache, cinsault]
      notes: "An elevated inland sector characterized by rocky, highly calcareous soils and steep slopes that yield deeply structured, intensely aromatic red wines dominated by old-vine Mourvèdre."

- id: corsica
  name: Corsica
  country: France
  climate: mediterranean
  known_for: [nielluccio, sciaccarellu, vermentino, muscat-petit-grain]
  notes: "The rugged 'Island of Beauty' in the Mediterranean Sea, where dramatic granite and schist mountain ranges plunge into the sea, creating a diverse mosaic of microclimates and ancient soils that yield distinctive, highly individualistic red, white, and rosé wines."
  subregions:
    - id: patrimonio
      name: Patrimonio
      known_for: [nielluccio, vermentino, sciaccarellu]
      notes: "Corsica's premier northern appellation situated on a unique geological amphitheater of limestone and clay-schist soils, yielding deeply structured, savory, and age-worthy red wines led by Nielluccio."

- id: vouvray
  name: Vouvray
  country: France
  climate: continental
  known_for: [chenin-blanc]
  notes: "The legendary Loire Valley appellation dedicated entirely to Chenin Blanc, situated on the right bank of the Loire River where chalky *tuffeau* limestone soils allow the grape to express remarkable versatility, ranging from bone-dry and sparkling to lusciously sweet, ageless dessert wines."
  subregions:
    - id: cote-de-vouvray
      name: Côte de Vouvray
      known_for: [chenin-blanc]
      notes: "The prime south-facing slopes overlooking the Loire River, featuring deep *tuffeau* limestone and clay-silica soils that produce rich, opulent, and vibrantly acidic Chenin Blancs with exceptional aging potential."

- id: montlouis-sur-loire
  name: Montlouis-sur-Loire
  country: France
  climate: continental
  known_for: [chenin-blanc]
  notes: "The charming neighbor of Vouvray situated directly across the Loire River on a plateau between the Loire and Cher rivers, dedicated exclusively to Chenin Blanc and celebrated for crafting vibrant, expressive dry, off-dry, and world-class sparkling wines."
  subregions:
    - id: plateau-de-montlouis
      name: Plateau de Montlouis
      known_for: [chenin-blanc]
      notes: "The elevated plateau featuring distinct *perruches* (clay-silica flints) and *tuffeau* limestone subsoils that yield exceptionally mineral-driven, razor-sharp, and aromatic Chenin Blancs with striking natural acidity."

- id: savennieres
  name: Savennières
  country: France
  climate: continental
  known_for: [chenin-blanc]
  notes: "An elite and historic wine region on the right bank of the Loire River in Anjou, renowned for producing some of the world's most complex, powerful, and age-worthy dry Chenin Blancs, defined by dramatic schist, sandstone, and volcanic soils."
  subregions:
    - id: savennieres-roche-aux-moines
      name: Savennières-Roche-aux-Moines
      known_for: [chenin-blanc]
      notes: "A prestigious, steep south-facing historic vineyard enclave overlooking the Loire, rooted in hard, fractured volcanic and schist soils that yield monumental, intensely concentrated, and mineral-driven dry white wines."

- id: bordeaux
  name: Bordeaux
  country: France
  climate: maritime
  known_for: [cabernet-sauvignon, merlot, cabernet-franc, petit-verdot, sauvignon-blanc, semillon, muscadelle]
  notes: "The global benchmark for age-worthy, structured red blends and botrytized sweet wines. Formed by the Gironde estuary and the Dordogne and Garonne rivers, its vast vineyard landscape is uniquely classified by individual châteaux rather than specific vineyard land."
  subregions:
    - id: medoc
      name: Médoc (Left Bank)
      known_for: [cabernet-sauvignon, merlot]
      notes: "Gravel-rich gravelly outcrops over clay subsoils stretching north of Bordeaux city; home to legendary classified growths producing structured, tannic, and deeply age-worthy Cabernet-dominant blends."
    - id: saint-emilion-pomerol
      name: Libournais (Right Bank)
      known_for: [merlot, cabernet-franc]
      notes: "Clay and limestone-dominated terrain east of the rivers where Merlot reigns, yielding plush, opulent, and rounder reds with rich aromatics of dark plum, cocoa, and truffle."
    - id: graves-pessac-leognan
      name: Graves & Pessac-Léognan
      known_for: [cabernet-sauvignon, merlot, sauvignon-blanc, semillon]
      notes: "The historic cradle of Bordeaux wine south of the city, featuring ancient pebble soils that produce both exceptional structured reds and world-class, oak-aged dry white blends."
    - id: sauternes-barsac
      name: Sauternes & Barsac
      known_for: [semillon, sauvignon-blanc]
      notes: "Misty microclimates created by the convergence of the Ciron and Garonne rivers, fostering the perfect conditions for noble rot (Botrytis cinerea) to produce opulent, honeyed, and immortal sweet wines."

- id: bergerac
  name: Bergerac
  country: France
  climate: maritime
  known_for: [merlot, cabernet-sauvignon, cabernet-franc, sauvignon-blanc, semillon]
  notes: "Historic southwestern French region situated just east of Bordeaux along the Dordogne River, sharing similar grape varieties and limestone-clay soils but offering approachable, value-driven alternatives."
  subregions:
    - id: monbazillac
      name: Monbazillac
      known_for: [semillon, sauvignon-blanc, muscadelle]
      notes: "Mist-shrouded hillside appellation near the Dordogne River cultivating botrytized grapes to produce rich, honeyed, and aromatic sweet white wines."

- id: champagne
  name: Champagne
  country: France
  climate: continental
  known_for: [chardonnay, pinot-noir, pinot-meunier]
  notes: "The world's most famous sparkling wine region located in northeastern France, defined by chalky subsoils, a rigorous cool climate, and the traditional method of secondary bottle fermentation to craft elegant, complex, and celebratory bubbles."
  subregions:
    - id: cotes-des-blancs
      name: Côte des Blancs
      known_for: [chardonnay]
      notes: "A chalk-dominated ridge stretching south of Épernay, renowned for producing pure, mineral-driven, and ultra-refined Blanc de Blancs Champagnes with vibrant acidity and aging potential."
    - id: montagne-de-reims
      name: Montagne de Reims
      known_for: [pinot-noir, chardonnay, pinot-meunier]
      notes: "The prominent forest-capped plateau sitting just south of Reims, famous for its south-facing chalky slopes and boasting a high concentration of Grand Cru villages that yield powerful, structured, and age-worthy Pinot Noir-dominant Champagnes."
    - id: vallee-de-la-marne
      name: Vallée de la Marne
      known_for: [pinot-meunier, pinot-noir, chardonnay]
      notes: "A sweeping valley stretching west along the winding Marne River, characterized by marl, clay, and sand-rich soils where Pinot Meunier reigns supreme, crafting soft, expressive, fruit-forward, and approachable Champagnes."
    - id: cote-des-bar
      name: Côte des Bar
      known_for: [pinot-noir, chardonnay, pinot-blanc]
      notes: "Champagne's southernmost subregion located in the Aube department, closer to Chablis than Reims, featuring Kimmeridgian limestone soils that yield richly textured, aromatic, and distinctly fruit-driven Pinot Noir Champagnes."
        

- id: loire-valley
  name: Loire Valley (Val de Loire)
  country: France
  climate: diverse
  known_for: [sauvignon-blanc, chenin-blanc, cabernet-franc, melon-de-bourgogne]
  notes: "France's diverse garden region stretching along the majestic Loire River from the central massif to the Atlantic coast, famous for crisp whites, savory reds, and world-class sparkling and sweet styles."
  subregions:
      - id: upper-loire
        name: Upper Loire (Sancerre & Pouilly-Fumé)
        known_for: [sauvignon-blanc, pinot-noir]
        notes: "Kimmeridgian limestone and flinty soils producing taut, mineral, and intensely aromatic Sauvignon Blanc with hallmark gunflint notes."
      - id: touraine
        name: Touraine (Chinon & Bourgueil)
        known_for: [cabernet-franc, chenin-blanc]
        notes: "Tuffeau chalk caves and gravel soils yielding expressive, aromatic Cabernet Franc with vibrant red fruit, green bell pepper, and graphite notes."
      - id: anjou-saumur
        name: Anjou-Saumur
        known_for: [chenin-blanc, cabernet-franc]
        notes: "The undisputed home of Chenin Blanc, producing breathtakingly versatile dry, off-dry, sparkling, and legendary botrytized sweet wines like Quarts de Chaume."
      - id: pays-nantais
        name: Pays Nantais (Muscadet)
        known_for: [melon-de-bourgogne]
        notes: "Atlantic maritime zone where Melon de Bourgogne grapes are aged on their fine lees (sur lie) to yield bone-dry, razor-sharp, saline whites."

- id: languedoc-roussillon
  name: Languedoc-Roussillon
  country: France
  climate: mediterranean
  known_for: [syrah, grenache, carignan, mourvedre, chardonnay]
  notes: "France's vast southern powerhouse stretching from the Rhône Valley to the Spanish border, combining sun-drenched vineyards with ancient rugged terrain to produce innovative blends and value-driven wines."
  subregions:
    - id: corbieres
      name: Corbières
      known_for: [syrah, grenache, carignan]
      notes: "Rugged, wild hillsides featuring diverse schist, limestone, and sandstone soils yielding deep, spicy, and earthy Mediterranean red blends."

- id: provence
  name: Provence
  country: France
  climate: mediterranean
  known_for: [grenache, cinsault, syrah, tibouron, mourvedre, rolle]
  notes: "France's sun-baked, lavender-scented southern paradise, cradled by the Mediterranean Sea and rugged limestone mountains, world-renowned as the global capital of pale, crisp, and elegant rosé wines."
  subregions:
    - id: cotes-de-provence
      name: Côtes de Provence
      known_for: [grenache, cinsault, syrah, tibouron, rolle]
      notes: "The largest and most famous appellation stretching across varied schist and limestone terroirs, crafting iconic, refreshingly delicate pink wines with herbal, citrus, and red-berry aromatics."

- id: limoux
  name: Limoux
  country: France
  climate: mediterranean
  known_for: [chardonnay, mauzac, chenin-blanc, pinot-noir]
  notes: "An ancient southern French wine region nestled in the foothills of the Pyrenees in the upper Aude Valley, celebrated as the historic birthplace of sparkling wine (Blanquette de Limoux) crafted centuries before Champagne, alongside stellar still Chardonnays."
  subregions:
    - id: haut-vallee-de-l-aude
      name: Haute Vallée de l'Aude
      known_for: [chardonnay, chenin-blanc, pinot-noir]
      notes: "The highest, coolest, and most altitude-driven sector of the appellation, featuring limestone and clay soils swept by Atlantic winds, producing exceptionally vibrant, crisp, and mineral-driven sparkling and still white wines."


- id: peloponnese
  name: Peloponnese
  country: Greece
  climate: mediterranean-continental
  known_for: [agiorgitiko, moschofilero, mavrodaphne, roditis, assyrtiko]
  notes: "Greece's premier winemaking peninsula, featuring a dramatic landscape of rugged mountain ranges, high plateaus, and coastal valleys where varied microclimates and ancient limestone-rich soils support a vast array of celebrated indigenous grape varieties."
  subregions:
    - id: nemea
      name: Nemea
      known_for: [agiorgitiko]
      notes: "Greece's most celebrated red wine region, located in the northeastern Peloponnese. Its flagship grape, Agiorgitiko, is remarkably versatile, producing everything from approachable, fruit-forward reds to deeply complex, structured bottles capable of decades of aging."
    - id: mantineia
      name: Mantineia
      known_for: [moschofilero]
      notes: "A high-altitude, plateau-based wine region in the central Peloponnese surrounded by towering mountains, where cool continental winds, poor sandy-clay soils, and dramatic diurnal shifts create an ideal environment for producing exceptionally aromatic, crisp, and floral white wines."

- id: macedonia
  name: Macedonia (Makedonia)
  country: Greece
  climate: continental
  known_for: [xinomavro, malagousia, assyrtiko]
  notes: "Northern Greece's powerhouse wine region, defined by rugged mountains and high-altitude vineyards. Its flagship red grape, Xinomavro, is frequently compared to Nebbiolo for its high acidity, gripping tannins, and savory aging potential."
  subregions:
    - id: naoussa
      name: Naoussa
      known_for: [xinomavro]
      notes: "The benchmark appellation requiring 100% Xinomavro. Produces structured, highly age-worthy wines with hallmark aromas of sundried tomato, olive tapenade, and dark spice."
    - id: amynteo
      name: Amynteo (Amyndeo)
      known_for: [xinomavro, assyrtiko]
      notes: "A cooler, high-elevation plateau influenced by surrounding lakes. Yields more elegant, floral, and lighter-bodied Xinomavro, alongside excellent rosés and traditional method sparkling wines."
    - id: goumenissa
      name: Goumenissa
      known_for: [xinomavro, negoska]
      notes: "A slightly warmer enclave where Xinomavro must be co-fermented with at least 20% Negoska, resulting in softer tannins, higher alcohol, and deeper color."

- id: samos
  name: Samos
  country: Greece
  climate: mediterranean
  known_for: [muscat-blanc-a-petits-grains]
  notes: "A dramatic, sun-drenched Greek island in the eastern Aegean Sea featuring steep, terraced mountain slopes carved into schist and limestone, where cooling maritime breezes temper the intense heat to produce some of the world's most renowned aromatic, sweet, and dry Muscat wines."
  subregions:
    - id: altars-of-vinion
      name: Vourliotes
      known_for: [muscat-blanc-a-petits-grains]
      notes: "An elevated northern mountain subregion featuring steep, poor slate terraces that yield exceptionally concentrated, intensely aromatic, and balanced sweet Muscat wines."

- id: campania
  name: Campania
  country: Italy
  climate: mediterranean
  known_for: [fiano, greco, falanghina, aglianico]
  notes: "One of Italy's oldest and most dramatic wine regions, dominated by ancient volcanic soils (Vesuvius and Irpinia) and steep, sun-drenched hillsides. Famed for producing some of Italy's most age-worthy, mineral-driven whites and powerhouse reds."
  subregions:
    - id: taurasi
      name: Taurasi
      known_for: [aglianico]
      notes: "The 'Barolo of the South.' High-elevation volcanic and clay soils produce deeply structured, muscular Aglianico with soaring acidity, firm tannins, and complex aromas of dark cherry, leather, and smoke."
    - id: fiano-di-avellino
      name: Fiano di Avellino
      known_for: [fiano]
      notes: "Cool, inland Apennine hills yielding a world-class white wine known for its distinct golden color, texture, and complex notes of toasted hazelnut, honey, pear, and struck flint."
    - id: greco-di-tufo
      name: Greco di Tufo
      known_for: [greco]
      notes: "Sulfur- and tuff-rich volcanic soils give this crisp white its signature intense minerality, bright citrus profile, and a dry, almond-bitter finish."

- id: piedmont
  name: Piedmont
  country: Italy
  climate: continental           # cool | continental | mediterranean | maritime
  known_for: [nebbiolo, barbera, moscato]
  notes: "Foggy foothills of the Alps; nebbia (fog) names the grape."
  subregions:
    - id: barolo
      name: Barolo
      known_for: [nebbiolo]
      notes: "Nebbiolo at full power; DOCG, long aging requirements."
    - id: barbaresco
      name: Barbaresco
      known_for: [nebbiolo]
      notes: "Nebbiolo's gentler, earlier-drinking side."

- id: abruzzo
  name: Abruzzo
  country: Italy
  climate: mediterranean-continental
  known_for: [montepulciano, trebbiano-d-abruzzo, pecorino, passerina, cococciola]
  notes: "A rugged and wild wine region on Italy's Adriatic coast dominated by the towering Apennine Mountains, where dramatic diurnal temperature shifts, sea breezes, and limestone-rich alluvial soils produce robust, deeply colored red wines and complex, texturally rich whites."
  subregions:
    - id: montepulciano-d-abruzzo-colline-teramane
      name: Colline Teramane
      known_for: [montepulciano]
      notes: "The premier northern hill subregion of Abruzzo nestled between the mountains and the sea, featuring well-drained clay-limestone soils and excellent solar exposure that yield structured, elegant, and exceptionally age-worthy Montepulciano d'Abruzzo."

- id: umbria
  name: Umbria
  country: Italy
  climate: continental-mediterranean
  known_for: [sagrantino, sangiovese, grechetto, trebbiano-spoletino, merlot]
  notes: "The verdant 'Green Heart of Italy,' an enchanting landlocked region featuring rolling hills, medieval hilltop towns, and ancient volcanic and clay soils that produce powerful, structured red wines and vibrant, crisp whites."
  subregions:
    - id: montefalco
      name: Montefalco
      known_for: [sagrantino, sangiovese]
      notes: "The historic wine capital of Umbria centered around ancient hilltop walls, featuring clay-limestone and sandy soils that yield fiercely tannic, deeply concentrated, and legendary age-worthy red wines."

- id: lazio
  name: Lazio
  country: Italy
  climate: mediterranean
  known_for: [malvasia-puntinata, trebbiano, cesanese, sangiovese, bellone]
  notes: "The historic heartland of Italy surrounding Rome, stretching from volcanic hills to the Tyrrhenian coast, celebrated for its ancient winemaking heritage and vibrant, refreshing white wines alongside expressive indigenous reds."
  subregions:
    - id: castelli-romani
      name: Castelli Romani
      known_for: [malvasia-puntinata, trebbiano, bellone]
      notes: "The scenic volcanic hills just south of Rome featuring mineral-rich, porous soils that yield iconic, aromatic, and zesty white wines with distinctive crisp freshness."

- id: orvieto
  name: Orvieto
  country: Italy
  climate: mediterranean-continental
  known_for: [grechetto, trebbiano-toscano, verdello, malvasia, canaiolo]
  notes: "Umbria's historic white wine appellation centered on dramatic tufa cliffs, where volcanic soils, ancient subterranean cellars, and unique microclimates produce vibrant, refreshing, and mineral-driven white wines ranging from crisp dry styles to celebrated sweet versions."

- id: castilla-la-mancha
  name: Castilla-La Mancha
  country: Spain
  climate: continental
  known_for: [airen, tempranillo, cencibel, bobal, syrah, cabernet-sauvignon]
  notes: "The largest continuous vine-growing area in the world, stretching across the vast central plateau of Spain. Historically known for high-volume bulk production, it has undergone a massive modernization wave, now producing incredible value-driven varietal wines and deep, sun-drenched reds from old-bush vines."
  subregions:
    - id: la-mancha
      name: La Mancha DO
      known_for: [airen, tempranillo]
      notes: "The heartland spanning the high plains, dominated by the drought-resistant white Airén grape and robust, fruit-forward Tempranillo."
      
    - id: ribera-del-jucar
      name: Ribera del Júcar
      known_for: [bobal, tempranillo]
      notes: "A unique pocket featuring pebble-strewn soils and a slightly cooling microclimate from the Júcar river, yielding deeply colored, structured reds with excellent balance."
    
    - id: dominio-de-valdepusa
      name: Dominio de Valdepusa
      known_for: [cabernet-sauvignon, syrah, petit-verdot]
      notes: "A prestigious, single-estate Vino de Pago located near Toledo, pioneering international grape varieties on limestone-clay soils with great success."

- id: bierzo
  name: Bierzo
  country: Spain
  climate: continental
  known_for: [mencia, godello, palomino-fino, garnacha-tintorera]
  notes: "A dramatic mountainous wine region in northwestern Spain where green Galician valleys meet the dry plains of Castilla y León, featuring steep terraced hillsides, slate and clay soils, and old-vine plantings that yield aromatic, mineral-driven white wines and vibrant, floral, and structured reds."
  subregions:
    - id: bierzo-alto
      name: Bierzo Alto
      known_for: [mencia, godello]
      notes: "The rugged, higher-altitude slopes of the region featuring steep, poor slate soils and old, low-yielding bush vines that produce deeply complex, elegant, and mineral-infused Mencía and age-worthy Godello."

- id: ribeira-sacra
  name: Ribeira Sacra
  country: Spain
  climate: continental
  known_for: [mencia, godello, brancellao, merenzao, treixadura]
  notes: "A dramatic and vertigo-inducing wine region in inland Galicia carved by the steep canyons of the Sil and Miño rivers, where extreme terraced hillside vineyards (*socalcos*), granitic and slate soils, and Atlantic-continental influences produce mineral-driven, elegant red and white wines of exceptional purity."
  subregions:
    - id: rinas-do-sil
      name: Ribeiras do Sil
      known_for: [mencia, godello]
      notes: "The sun-drenched canyon subregion along the Sil river featuring vertiginous slate-and-granite terraces that yield deeply concentrated, structured, and intensely aromatic Mencía reds and crisp, vibrant Godellos."

- id: valdeorras
  name: Valdeorras
  country: Spain
  climate: continental
  known_for: [godello, mencia, merenzao, gran-negro]
  notes: "An ancient wine region in northeastern Galicia set along the steep valley of the Sil River, where a unique transitional climate combining Atlantic rainfall with continental warmth, alongside distinctive slate and alluvial soils, has revived world-class, mineral-driven white Godello and expressive, elegant reds."
  subregions:
    - id: o-barco
      name: O Barco
      known_for: [godello, mencia]
      notes: "The central valley core of Valdeorras featuring terraced hillside vineyards planted in poor, iron-rich slate and decomposed granite soils that yield intensely textured, complex, and age-worthy Godello."

- id: yecla
  name: Yecla
  country: Spain
  climate: continental-mediterranean
  known_for: [monastrell, garnacha-tintorera, syrah, cabernet-sauvignon, macabeo]
  notes: "A high-altitude, sun-drenched plateau wine region in southeastern Spain where extreme temperature swings, low rainfall, and poor, limestone-rich soils allow ancient, head-trained Monastrell vines to produce deeply concentrated, powerful, and aromatic red wines."
  subregions:
    - id: campo-arriba
      name: Campo Arriba
      known_for: [monastrell]
      notes: "The elevated interior zone featuring stony, chalky alluvial soils over hard limestone bedrock that yield exceptionally structured, dark-fruited, and complex old-vine Monastrell."

- id: jumilla
  name: Jumilla
  country: Spain
  climate: continental-mediterranean
  known_for: [monastrell, syrah, garnacha-tintorera, cabernet-sauvignon, macabeo]
  notes: "A rugged, sun-scorched high-altitude wine region in southeastern Spain characterized by extreme aridity, intense summer heat, and sandy, limestone-rich soils that remained entirely phylloxera-free, allowing vast expanses of ancient, ungrafted Monastrell bush vines to thrive and produce deeply concentrated, powerful red wines."
  subregions:
    - id: estenas
      name: Tierra de Barahonda (Jumilla Alta)
      known_for: [monastrell, syrah]
      notes: "The higher-altitude, mountainous northern subregion featuring chalky, poor soils and cooler night temperatures that yield structured, fresher, and more aromatically complex old-vine Monastrell."

- id: bullas
  name: Bullas
  country: Spain
  climate: continental-mediterranean
  known_for: [monastrell, syrah, tempranillo, garnacha-tintorera, macabeo]
  notes: "A mountainous and arid wine appellation in the northwest of the Murcia region, where high altitudes (up to 900 meters), intense sunlight, and poor, limestone-rich soils produce fresh, elegant, and deeply colored red wines centered around ancient old-vine Monastrell."
  subregions:
    - id: el-ripio
      name: El Ripio
      known_for: [monastrell, syrah]
      notes: "An elevated subzone characterized by stony, chalky, and gravelly soils that experience dramatic day-to-night temperature variations, yielding exceptionally structured, balanced, and perfumed Monastrell."

- id: andalucia
  name: Andalucía
  country: Spain
  climate: mediterranean
  known_for: [palomino-fino, pedro-ximenez, moscatel, tempranillo, syrah]
  notes: "A sun-baked, historically rich wine macro-region in southernmost Spain shaped by intense heat, Atlantic sea winds, and unique albariza chalk soils, famous worldwide for producing complex, biological and oxidative fortified wines."
  subregions:
    - id: jerez-xeres-sherry
      name: Jerez-Xérès-Sherry
      known_for: [palomino-fino, pedro-ximenez, moscatel]
      notes: "The legendary Sherry triangle in the coastal west featuring chalk-rich *albariza* soils that retain crucial moisture under the blistering sun, yielding world-class fortified wines ranging from bone-dry Fino to decadent, aged Oloroso."

- id: puglia
  name: Puglia
  country: Italy
  climate: mediterranean
  known_for: [primitivo, negroamaro, nero-di-troia, fiano, falanghina]
  notes: "The sun-drenched 'heel' of Italy's boot, sweeping between the Adriatic and Ionian seas, where ancient limestone soils, cooling sea breezes, and intense Mediterranean sunshine produce rich, generous, and deeply fruit-forward red and white wines."
  subregions:
    - id: salento
      name: Salento
      known_for: [negroamaro, primitivo, malvasia-nera]
      notes: "The sun-baked peninsula forming the very heel of Puglia, featuring iron-rich red clay (*terra rossa*) over limestone bedrock that yields legendary, velvety, and spice-laden red wines."

- id: marche
  name: Marche
  country: Italy
  climate: maritime-mediterranean
  known_for: [verdicchio, montepulciano, sangiovese, biancame, pecorino]
  notes: "A picturesque coastal and hilly wine region in central Italy stretching from the Apennine Mountains to the Adriatic Sea, where cooling mountain drafts, sea breezes, and complex clay-limestone soils produce world-class, ageworthy white wines and vibrant, savory reds."
  subregions:
    - id: verdicchio-dei-castelli-di-jesi
      name: Verdicchio dei Castelli di Jesi
      known_for: [verdicchio]
      notes: "The premier white wine heartland of the region situated in rolling hills near Jesi, featuring chalky-clay soils and a favorable microclimate that yield structured, intensely mineral, and long-lived Verdicchio wines with signature almond notes."

- id: molise
  name: Molise
  country: Italy
  climate: mediterranean-continental
  known_for: [tintilia, montepulciano, aglianico, trebbiano-toscano, falanghina]
  notes: "A rugged, mountainous, and relatively undiscovered wine region in southern Italy nestled between Abruzzo, Campania, and Puglia, where steep Apennine slopes, cooling Adriatic breezes, and diverse limestone and clay soils produce authentic, rustic, and increasingly refined red and white wines."
  subregions:
    - id: tintilia-del-molise
      name: Tintilia del Molise
      known_for: [tintilia]
      notes: "The premier high-altitude hilly subregion dedicated to the indigenous Tintilia grape, featuring poor clay-limestone soils and cool diurnal shifts that yield deeply colored, spicy, and distinctive red wines with exceptional local character."

- id: valencia
  name: Valencia
  country: Spain
  climate: mediterranean
  known_for: [bobal, moscatel, monastrell]
  notes: "Sun-drenched coastal Spanish region bridging ancient winemaking traditions with modern value-driven production."
  subregions:
    - id: utiel-requena
      name: Utiel-Requena
      known_for: [bobal]
      notes: "Inland plateau dominated by ancient, drought-tolerant Bobal vines yielding deep-colored, structured reds."

- id: iberian
  name: Iberian Peninsula (Spain and Portugal)
  country: Spain, Portugal
  climate: diverse
  known_for: [tempranillo, touriga-nacional, albarino, garnacha]
  notes: "A massive, topographically diverse wine mega-region encompassing the entirety of Spain and Portugal. It boasts an astonishing array of ancient native grape varieties, extreme climatic contrasts from Atlantic coasts to arid interior mesetas, and legendary styles ranging from crisp coastal whites to fortified ports and sherries."
  subregions:
    - id: douro
      name: Douro
      known_for: [touriga-nacional, tinta-roriz, touriga-franca]
      notes: "A dramatic, steeply terraced schist valley carved by the Douro River, world-famous for crafting legendary Port wines as well as structured, deeply concentrated dry reds."

- id: rias-baixas
  name: Rías Baixas
  country: Spain
  climate: maritime
  known_for: [albarino, loureira, caino-blanco]
  notes: "The emerald-green cradle of world-class white wines in northwestern Spain's Galicia region. Shaped by heavy Atlantic rainfall, cooling breezes, and granite-rich soils, it produces intensely aromatic, high-acid, and salinity-driven wines."
  subregions:
    - id: val-do-salnes
      name: Val do Salnés
      known_for: [albarino]
      notes: "The historical birthplace and coolest subzone of Rías Baixas, flanking the Atlantic coast; yields the most quintessential, bone-dry, razor-sharp, and laser-focused Albariños with vibrant mineral character."

- id: catalonia
  name: Catalonia (Catalunya)
  country: Spain
  climate: mediterranean
  known_for: [xarel-lo, macabeu, parellada, garnacha, carinena]
  notes: "A dynamic northeastern Spanish wine powerhouse stretching from the Mediterranean coast to the Pyrenees. Famed globally as the birthplace of Cava, it also houses some of the world's most dramatic, mineral-driven slate and limestone terroir for world-class still reds."
  subregions:
    - id: priorat
      name: Priorat
      known_for: [garnacha, carinena]
      notes: "A rugged, steep-sloped DOCa featuring crumbly black slate soils known as llicorella, producing intensely concentrated, mineral, and powerful age-worthy red wines from ancient bush vines."

- id: extremadura
  name: Extremadura
  country: Spain
  climate: continental-mediterranean
  known_for: [tempranillo, garnacha, syrah, cabernet-sauvignon, cayetana-blanca, pardina]
  notes: "Spain's vast western wine frontier bordering Portugal, transitioning from historic bulk production to modern, sun-drenched, and structured reds alongside fresh native whites."

- id: ucles
  name: Uclés
  country: Spain
  climate: continental
  known_for: [tempranillo, cabernet-sauvignon, syrah, verdejo]
  notes: "High-altitude Spanish wine region in Castilla-La Mancha defined by the Sierra de Altomira, producing fresher, more structured Tempranillos than the surrounding flat plains."
  subregions:
    - id: sierra-altomira
      name: Sierra de Altomira
      known_for: [tempranillo, syrah]
      notes: "Rugged high-altitude limestone slopes producing deeply concentrated, mineral-driven red wines with notable acidity and aging potential."

- id: aragon
  name: Aragón
  country: Spain
  climate: continental-mediterranean
  known_for: [garnacha, tempranillo, carinena, syrah, macabeo]
  notes: "Rugged and historic northeastern Spanish wine region shaped by the Ebro River basin and the imposing shadow of the Pyrenees, famous for ancient, low-yielding Garnacha and deeply structured mountain-influenced reds."
  subregions:
    - id: campo-de-borja
      name: Campo de Borja
      known_for: [garnacha, tempranillo, syrah]
      notes: "Known globally as the 'Empire of Garnacha,' featuring iron-rich clay and stony limestone soils at the foot of the Moncayo mountains that produce powerful, fruit-forward, and velvety red wines."

- id: navarra
  name: Navarra
  country: Spain
  climate: mediterranean
  known_for: [garnacha, tempranillo, cabernet-sauvignon, merlot, chardonnay, viura]
  notes: "A historically rich wine region in northern Spain stretching from the damp, green foothills of the western Pyrenees down to the dry, sun-baked Ebro River basin, where a unique clash of Atlantic, continental, and Mediterranean climates produces diverse styles ranging from world-class rosés to structured, fruit-driven reds."
  subregions:
    - id: baja-montana
      name: Baja Montaña
      known_for: [garnacha]
      notes: "The rugged, elevated northern subregion nestled against the Pyrenean foothills, featuring poor limestone and clay soils that yield exceptionally fresh, aromatic, and elegant old-vine Garnacha red wines."

- id: alicante
  name: Alicante
  country: Spain
  climate: mediterranean
  known_for: [monastrell, moscatel-de-alejandria, garnacha-tintorera, merseguera, tempranillo]
  notes: "A historic Mediterranean wine region in southeastern Spain framed by rugged mountain ranges and sweeping coastal plains, where intense sunshine, dry conditions, and poor limestone soils produce powerful, deep-colored red wines alongside the legendary sweet dessert wine Fondillón."
  subregions:
    - id: alicante-vinalopo
      name: Vinalopó (Alto Vinalopó and Medio Vinalopó)
      known_for: [monastrell, garnacha-tintorera, merseguera]
      notes: "The inland valley subregion carved by the Vinalopó River, featuring high-altitude, limestone-rich soils and dramatic diurnal temperature shifts that yield structured, highly concentrated old-vine Monastrell and fresh, aromatic whites."

- id: rioja
  name: Rioja
  country: Spain
  climate: continental
  known_for: [tempranillo, garnacha, graciano, mazuelo, viura]
  notes: "Spain's most famous and historic wine region, stretching along the Ebro River and protected by mountain ranges, renowned for its legendary, oak-aged Tempranillo-based red wines classified by aging tiers."
  subregions:
    - id: rioja-alta
      name: Rioja Alta
      known_for: [tempranillo, graciano]
      notes: "High-altitude western sector featuring iron-rich clay and alluvial soils over limestone, producing elegant, balanced, and highly age-worthy red wines with bright acidity."

- id: vinho-verde
  name: Vinho Verde
  country: Portugal
  climate: maritime
  known_for: [alvarinho, loureiro, avesso, trajadura]
  notes: "Portugal's largest appellation, located in the lush, rainy northwestern corner of the country. Translating to 'green wine,' it is historically famed for crisp, vibrant, and low-alcohol wines meant to be enjoyed young, though top estates now produce complex, age-worthy single-varietal expressions."
  subregions:
    - id: moncao-e-melgaco
      name: Monção e Melgaço
      known_for: [alvarinho]
      notes: "The northernmost, warmer, and sheltered subregion bordering Spain; the undisputed home of powerful, structured, and complex Alvarinho with notes of stone fruit and citrus peel."

- id: madeira
  name: Madeira
  country: Portugal
  climate: maritime
  known_for: [bual, malvasia, sercial, verdelho, tinta-negra]
  notes: "A breathtaking volcanic island in the Atlantic Ocean governed by a sub-tropical maritime climate, where steep, hand-farmed terraces (*poios*), basaltic soils, and a unique winemaking process involving controlled heat and oxygen exposure create legendary, virtually immortal fortified wines."
  subregions:
    - id: camara-de-lobos
      name: Câmara de Lobos
      known_for: [tinta-negra, bual, malvasia]
      notes: "One of the island's most historic and productive south-facing wine areas, featuring steep, sun-drenched coastal and mid-level basaltic slopes that yield rich, concentrated, and complex fortified wines."

- id: dao
  name: Dão
  country: Portugal
  climate: continental
  known_for: [touriga-nacional, tinta-roriz, alfrocheiro, jaen, encruzado, bical]
  notes: "A historic and picturesque wine region in north-central Portugal encircled by protective mountain ranges—including Serra da Estrela—that block Atlantic storms, creating a cool, continental microclimate where granitic, acidic soils produce elegant, aromatic, and remarkably age-worthy red and white wines."
  subregions:
    - id: alva
      name: Alva
      known_for: [encruzado, touriga-nacional, bical]
      notes: "An elevated subregion situated along the foothills of the Serra da Estrela, featuring poor, highly weathered granitic soils that yield exceptionally fresh, mineral-driven whites and refined, perfumed red wines."

- id: lisboa
  name: Lisboa
  country: Portugal
  climate: maritime
  known_for: [touriga-nacional, aragonez, castelao, arinto, fernao-pires, chardonnay]
  notes: "Portugal's dynamic and diverse coastal wine region stretching north of Lisbon along the Atlantic Ocean, cooled by ocean breezes and renowned for producing food-friendly, crisp whites and expressive, structured reds."
  subregions:
    - id: colares
      name: Colares
      known_for: [ramisco, malvasia-fina]
      notes: "One of Europe's most unique and extreme historic appellations, featuring ungrafted, own-rooted vines planted directly in deep, shifting coastal sand dunes (*chão de areia*), producing exceptionally tannic, long-lived, and saline red wines."

- id: beira-atlantico
  name: Beira Atlântico
  country: Portugal
  climate: maritime
  known_for: [bical, arinto, cerceal, baga, touriga-nacional]
  notes: "A dynamic and maritime-influenced Portuguese wine region located in the historical Bairrada heartland, characterized by wet, cool Atlantic winds, clay-limestone soils, and legendary, high-acid, age-worthy red and sparkling wines."
  subregions:
    - id: bairrada-classico
      name: Bairrada
      known_for: [baga, bical, arinto]
      notes: "The historic core of the region featuring rolling hills with clay-limestone and sandy soils that yield structured, tannin-rich Baga reds and world-class, crisp traditional-method sparkling wines."

- id: transmontano
  name: Trás-os-Montes
  country: Portugal
  climate: continental
  known_for: [tinta-amarela, touriga-franca, bastardo, malvasia-fina, viosinho]
  notes: "A rugged, remote, and mountainous wine region in northeastern Portugal bordered by Spain, where extreme continental temperatures, high altitudes, and ancient schist and granite soils produce bold, structured red wines and vibrant, aromatic whites."
  subregions:
    - id: chaves
      name: Chaves
      known_for: [tinta-amarela, bastardo, malvasia-fina]
      notes: "The northernmost subregion near the Spanish border, featuring cool mountain elevations and granitic-alluvial soils that yield elegant, fresh, and distinctively aromatic red and white wines."

- id: setubal
  name: Setúbal Peninsula
  country: Portugal
  climate: mediterranean
  known_for: [moscatel-de-setubal, moscatel-roxo, castelao, aragonez]
  notes: "A sun-drenched Portuguese wine region nestled between the Sado and Tagus estuaries, world-renowned for its legendary, honeyed, and complex fortified Moscatel dessert wines, alongside powerful, sandy-soil red wines."
  subregions:
    - id: arrabida
      name: Serra da Arrábida
      known_for: [moscatel-de-setubal, castelao]
      notes: "Rugged limestone hills sloping down to the Atlantic, featuring unique microclimates and ancient bush vines that produce exceptionally concentrated, aromatic fortified wines and deeply structured reds."

- id: alentejo
  name: Alentejo
  country: Portugal
  climate: continental-mediterranean
  known_for: [aragonez, trincadeira, alicante-bouschet, touriga-nacional, antao-vaz, arinto]
  notes: "Portugal's sun-drenched southern wine heartland, characterized by rolling plains, ancient cork oak forests, and poor schist and granite soils that yield rich, velvety, and fruit-forward red wines alongside crisp, aromatic whites."
  subregions:
    - id: borba
      name: Borba
      known_for: [aragonez, trincadeira, alicante-bouschet, antao-vaz]
      notes: "One of the historic subregions featuring varied clay-limestone and quartz-rich soils, producing elegant, well-structured reds and fresh, balanced white wines."

- id: tejo
  name: Tejo
  country: Portugal
  climate: mediterranean
  known_for: [fernao-pires, touriga-nacional, aragonez, trincadeira]
  notes: "Formerly known as Ribatejo, this historic wine region flanks the Tagus (Tejo) River north of Lisbon. Blending fertile alluvial floodplains with nutrient-poor sandy and clay-limestone plateau soils, it has evolved from mass-producing bulk wine to crafting exceptional, fruit-forward reds and expressive, aromatic whites."
  subregions:
    - id: do-tejo-charneca
      name: Charneca
      known_for: [touriga-nacional, aragonez, syrah]
      notes: "The drier, southern bank of the river featuring sandy and poor clay soils, yielding deeply colored, concentrated, and structured red wines."

- id: california
  name: California
  country: United States
  climate: diverse
  known_for: [cabernet-sauvignon, chardonnay, pinot-noir, zinfandel, syrah]
  notes: "The undisputed economic and cultural powerhouse of New World wine. Stretching over 900 miles of coastline, its vast climatic range spans cool, fog-shrouded maritime microclimates to baking inland valleys, producing an immense diversity of styles."
  subregions:
    - id: sonoma
      name: Sonoma
      known_for: [chardonnay, pinot-noir, cabernet-sauvignon, zinfandel]
      notes: "Directly west of Napa, Sonoma features a cooler, wilder, and more expansive landscape heavily shaped by Pacific fog currents, renowned for world-class cool-climate Burgundian varieties and bold, spicy old-vine Zinfandels."

- id: madera
  name: Madera
  country: United States
  climate: continental-mediterranean
  known_for: [zinfandel, muscat, chardonnay, touriga-nacional, grenache]
  notes: "One of California's oldest and warmest wine regions situated in the heart of the San Joaquin Valley, renowned for its sun-drenched climate, sandy-loam soils, and a historic legacy of producing rich, full-bodied table wines as well as world-class dessert and fortified wines."
  subregions:
    - id: madera-east
      name: East Madera Foothills
      known_for: [zinfandel, barbera, sangiovese]
      notes: "The elevated eastern boundary approaching the Sierra Nevada foothills, featuring rockier, well-drained soils and cooler nighttime mountain air that yield more balanced, vibrant, and structured red wines."

- id: emilia-romagna
  name: Emilia-Romagna
  country: Italy
  climate: continental
  known_for: [lambrusco, trebbiano, sangiovese, albana]
  notes: "A fertile culinary and viticultural powerhouse spanning Northern Italy from the Apennines to the Po Valley. Celebrated worldwide for its lively, food-friendly sparkling reds and rich, gastronomic history."
  subregions:
    - id: lambrusco-di-sorbara
      name: Lambrusco di Sorbara
      known_for: [lambrusco]
      notes: "The crown jewel of Lambrusco production; sandy soils yield a pale-hued, intensely floral, and brilliantly crisp sparkling red with laser-sharp acidity."

- id: lombardy
  name: Lombardy (Lombardia)
  country: Italy
  climate: continental
  known_for: [nebbiolo, chardonnay, pinot-noir, croatina, barbera]
  notes: "A sophisticated northern Italian wine region stretching from the high Alpine peaks to the Po River plain and the glacial lakes. Famed for producing Italy's finest traditional-method sparkling wines and elegant, mountain-influenced reds."
  subregions:
    - id: franciacorta
      name: Franciacorta
      known_for: [chardonnay, pinot-noir, pinot-blanc]
      notes: "Italy's premier sparkling wine region, crafted via the traditional method (refermentation in the bottle) to produce rich, creamy, and complex bubbles."

- id: friuli-venezia-giulia
  name: Friuli-Venezia Giulia
  country: Italy
  climate: maritime
  known_for: [friulano, ribolla-gialla, pinot-grigio, sauvignon-blanc, merlot]
  notes: "A premier northeastern Italian wine region nestled between the Alps and the Adriatic Sea, celebrated for producing some of the world's finest, most aromatic, and structured white wines alongside world-class skin-contact orange wines and elegant reds."
  subregions:
    - id: collio
      name: Collio Goriziano
      known_for: [friulano, ribolla-gialla, sauvignon-blanc, pinot-bianco]
      notes: "A breathtaking hilly border region featuring iconic *ponca* (marl and sandstone flysch) soils that impart striking minerality, depth, and elegance to iconic white wines."

- id: mount-etna
  name: Mount Etna (Etna)
  country: Italy
  climate: mediterranean
  known_for: [nerello-mascalese, nerello-capuccio, carricante, catarratto]
  notes: "Europe's highest active volcano, located on the island of Sicily, where dramatic high-altitude terraced vineyards planted in dark, mineral-rich volcanic ash yield hauntingly elegant, Burgundian-style reds and intensely vibrant, saline white wines."
  subregions:
    - id: etna-contrade
      name: Etna Contrade
      known_for: [nerello-mascalese, carricante]
      notes: "The historic cru designations (contrade) scattered across the volcano's slopes, featuring unique microclimates and ancient basaltic lava soils that produce exceptionally expressive, terroir-driven single-vineyard wines."

- id: sardinia
  name: Sardinia
  country: Italy
  climate: mediterranean
  known_for: [cannonau, vermentino, carignano, bovale, nasco]
  notes: "A rugged, wind-swept Italian island paradise in the Mediterranean boasting ancient winemaking traditions, dramatic coastal and inland terroirs, and unique indigenous grape varieties shaped by intense sunshine and sea breezes."
  subregions:
    - id: sulcis
      name: Sulcis
      known_for: [carignano, syrah]
      notes: "The sun-drenched southwestern corner of the island characterized by ancient, ungrafted bush-trained Carignano vines rooted in deep, sandy coastal soils, producing rich, velvety, and intensely aromatic red wines."

- id: central-valley-california
  name: Central Valley (California)
  country: United States
  climate: continental-mediterranean
  known_for: [chardonnay, zinfandel, merlot, cabernet-sauvignon, colombard]
  notes: "The agricultural engine and massive volume powerhouse of California wine, stretching over 300 miles through the flat interior basin. Fueled by sunshine and irrigation from the Sierra Nevada snowmelt, it produces a large portion of the state's everyday drinking wines and value-driven varietals."
  subregions:
    - id: lodi
      name: Lodi
      known_for: [zinfandel]
      notes: "Located in the northern portion of the valley, tempered by cooling breezes from the Sacramento-San Joaquin River Delta. Famed for holding some of the oldest, own-rooted, head-trained Zinfandel bush vines in the world, yielding rich, spicy, and fruit-forward reds."

- id: sierra-foothills
  name: Sierra Foothills
  country: United States
  climate: continental
  known_for: [zinfandel, syrah, barbera]
  notes: "Rugged Gold Rush-era region in California's Sierra Nevada mountains featuring iron-rich volcanic soils and high-elevation sunshine."
  subregions:
    - id: amador-county
      name: Amador County
      known_for: [zinfandel]
      notes: "Home to some of California's oldest surviving dry-farmed Zinfandel vines, producing bold, structured, and intensely spicy wines."

- id: washington
  name: Washington State
  country: United States
  climate: continental
  known_for: [cabernet-sauvignon, merlot, syrah, riesling, chardonnay]
  notes: "The Pacific Northwest's premier wine powerhouse, protected by the Cascade Mountains to create a dry, sun-drenched eastern desert terrain characterized by massive diurnal temperature shifts and glacier-scoured soils that yield exceptionally balanced, structured, and fruit-vibrant wines."
  subregions:
    - id: columbia-valley
      name: Columbia Valley
      known_for: [cabernet-sauvignon, merlot, syrah, riesling]
      notes: "The massive, defining macro-appellation spanning over a third of the state, encompassing diverse sandy loam and basalt soils that produce world-class, intensely concentrated red and white wines."

- id: mendoza
  name: Mendoza
  country: Argentina
  climate: high-altitude desert
  known_for: [malbec, cabernet-sauvignon, torrontes]
  notes: "The undisputed heart of Argentine wine, stretching along the rain shadow of the Andes Mountains with high-altitude vineyards offering intense sun and dramatic diurnal temperature shifts."
  subregions:
    - id: uco-valley
      name: Uco Valley
      known_for: [malbec, cabernet-franc, chardonnay]
      notes: "High-elevation alluvial soils producing exceptionally floral, structured, and vibrant Malbecs with soaring natural acidity."

- id: la-rioja-argentina
  name: La Rioja
  country: Argentina
  climate: desert
  known_for: [torrontes, bonarda, malbec, syrah, cabernet-sauvignon]
  notes: "One of Argentina's oldest viticultural regions, nestled in the arid foothills of the Andes where intense solar radiation, ancient irrigation channels fed by mountain snowmelt, and poor sandy-alluvial soils yield deeply aromatic white wines and fruit-forward, structured reds."
  subregions:
    - id: famatina-valley
      name: Famatina Valley (Valle de Famatina)
      known_for: [torrontes, bonarda, syrah]
      notes: "The premier winemaking valley cradled between the Famatina and Velasco mountain ranges, featuring high-altitude alluvial soils and extreme thermal amplitude that produce world-class, intensely perfumed Torrontés and lush, concentrated red wines."

- id: catamarca
  name: Catamarca
  country: Argentina
  climate: desert
  known_for: [torrontes, malbec, syrah, bonarda, cabernet-sauvignon]
  notes: "A dramatic and arid high-altitude wine province in northwestern Argentina, anchored by the extreme desert conditions of the Fiambalá Valley, where glacial meltwater, intense solar radiation, and sandy-rocky soils create exceptionally concentrated, powerful wines."
  subregions:
    - id: fiambala
      name: Fiambalá
      known_for: [torrontes, malbec, syrah]
      notes: "The premier winemaking enclave of Catamarca cradled between Andean peaks, featuring deep alluvial and sandy soils exposed to high thermal ranges, yielding intensely aromatic whites and lush, full-bodied red wines."

- id: salta
  name: Salta
  country: Argentina
  climate: desert
  known_for: [torrontes, malbec, tannat, cabernet-sauvignon]
  notes: "Argentina's dramatic northern wine frontier anchored by the Calchaquí Valley, where some of the highest vineyards in the world combine extreme solar radiation, cool mountain nights, and poor sandy-rocky soils to produce exceptionally aromatic, intensely colored, and structured wines."
  subregions:
    - id: cafayate
      name: Cafayate
      known_for: [torrontes, malbec, tannat]
      notes: "The premier high-altitude oasis of the Calchaquí Valley sitting over 1,700 meters above sea level, featuring alluvial sandy soils and intense diurnal temperature ranges that yield world-class, intensely perfumed Torrontés and deeply concentrated reds."

- id: mendocino
  name: Mendocino County
  country: United States
  climate: maritime
  known_for: [pinot-noir, chardonnay, zinfandel, sauvignon-blanc, riesling]
  notes: "California's rugged and heavily forested northern wine frontier, shaped by deep Pacific maritime influences, coastal mountain ranges, and organic farming traditions that yield distinctively wild, elegant, and expressive cool-climate wines."
  subregions:
    - id: anderson-valley
      name: Anderson Valley
      known_for: [pinot-noir, chardonnay, gewurztraminer, sparkling-wine]
      notes: "A cool, fog-shrouded inland valley stretching northwest toward the Pacific, featuring well-drained alluvial and sandstone soils that produce world-class, acid-driven Pinot Noir and aromatic white wines."

- id: columbia-gorge
  name: Columbia Gorge
  country: United States
  climate: continental
  known_for: [riesling, syrah, pinot-noir, chardonnay, gruner-veltliner]
  notes: "A dramatic and diverse wine region straddling the Columbia River along the border of Oregon and Washington, where a unique climatic transition zone shifts from a rainy western alpine forest to an eastern desert, allowing a remarkable mosaic of cool- and warm-climate varietals to thrive in volcanic and glacial soils."
- id: san-juan
  name: San Juan
  country: Argentina
  climate: desert
  known_for: [syrah, malbec, torrontes, bonarda]
  notes: "Argentina's second-largest wine-producing province, situated just north of Mendoza in a hot, sun-drenched high-desert valley."
  subregions:
    - id: tulum-valley
      name: Tulum Valley
      known_for: [syrah, malbec]
      notes: "The central irrigated lowlands producing rich, velvety, and fruit-forward reds, with Syrah shining as the local specialty."

- id: patagonia
  name: Patagonia
  country: Argentina
  climate: continental
  known_for: [malbec, pinot-noir, merlot, chardonnay, semillon]
  notes: "Argentina's southernmost wine frontier, stretching across windswept, dramatic plains fed by crystal-clear glacial rivers from the Andes, where intense sunshine, constant cooling winds, and high diurnal ranges create exceptionally fresh, vibrant, and elegant wines."
  subregions:
    - id: alto-valle-del-rio-negro
      name: Alto Valle del Río Negro
      known_for: [malbec, pinot-noir, merlot, semillon]
      notes: "The historic heart of Patagonian winemaking flanking the Río Negro, featuring ancient sandy-loam and alluvial soils that yield refined, highly aromatic, and complex wines with striking natural acidity."

- id: western-australia
  name: Western Australia
  country: Australia
  climate: maritime
  known_for: [cabernet-sauvignon, merlot, chardonnay]
  notes: "A pristine, isolated wine region heavily cooled by Indian Ocean maritime breezes, renowned for world-class, elegant Bordeaux-style blends."
  subregions:
    - id: margaret-river
      name: Margaret River
      known_for: [cabernet-sauvignon, merlot]
      notes: "Coastal gravelly loam soils producing refined, structured, and age-worthy Cabernet-dominant blends with signature blackcurrant and bay leaf notes."

- id: riverland
  name: Riverland
  country: Australia
  climate: mediterranean
  known_for: [chardonnay, shiraz, cabernet-sauvignon, sauvignon-blanc, colombard]
  notes: "Australia's largest and most prolific wine-producing region, stretching along the winding Murray River in South Australia, where abundant sunshine and controlled irrigation produce fruit-forward, approachable, and versatile table and fortified wines."
  subregions:
    - id: loxton
      name: Loxton
      known_for: [shiraz, chardonnay, cabernet-sauvignon]
      notes: "A key viticultural hub along the Murray River featuring deep, red sandy-loam soils and consistent sunshine, yielding generous, plush, and fruit-driven red and white wines."

- id: riverina
  name: Riverina
  country: Australia
  climate: mediterranean
  known_for: [semillon, chardonnay, shiraz, cabernet-sauvignon, nero-d-avola]
  notes: "Australia's second-largest wine-producing region located in New South Wales around Griffith, famous for producing generous, fruit-driven table wines and world-renowned, luscious botrytis sweet wines enabled by warm sunshine and regulated irrigation."

- id: goulburn-valley
  name: Goulburn Valley
  country: Australia
  climate: continental
  known_for: [shiraz, marsanne, cabernet-sauvignon, chardonnay, riesling]
  notes: "One of Victoria's historic inland wine regions framed by the Goulburn River, where flat terrain, ancient sandy-loam soils, and protective irrigation and cooling evening drafts combine to produce remarkably balanced, age-worthy red wines and world-class, slow-aging Marsanne."
  subregions:
    - id: tahbilk
      name: Nagambie Lakes
      known_for: [marsanne, shiraz, cabernet-sauvignon]
      notes: "A unique subregion defined by a network of man-made and natural waterways moderated by the Goulburn River, featuring ironstone gravel and sandy loam soils that create a distinct microclimate ideal for producing legendary, long-lived Marsanne and complex, spiced Shiraz from ungrafted pre-phylloxera vines."

- id: barossa-valley
  name: Barossa Valley
  country: Australia
  climate: mediterranean
  known_for: [shiraz, cabernet-sauvignon, grenache, mataro, semillon, riesling]
  notes: "One of Australia's oldest and most revered wine regions, situated just northeast of Adelaide, where a warm Mediterranean climate, ancient dry-farmed soils, and some of the world's oldest surviving ungrafted vines yield rich, powerful, and intensely flavoured red and white wines."
  subregions:
    - id: eden-valley
      name: Eden Valley
      known_for: [riesling, shiraz, chardonnay]
      notes: "The cooler, high-altitude subregion perched on the eastern ridges of the Barossa zone, featuring poor, rocky quartz and ironstone soils that produce world-class, bone-dry, lime-scented Riesling and elegant, savory Shiraz."

- id: mclaren-vale
  name: McLaren Vale
  country: Australia
  climate: mediterranean
  known_for: [shiraz, grenache, cabernet-sauvignon, chardonnay, fiano]
  notes: "A picturesque coastal wine region south of Adelaide where cooling sea breezes from the Gulf St Vincent moderate a warm Mediterranean climate, allowing ancient, diverse soils—ranging from deep sands and clays to ancient ironstone and limestone—to produce rich, textured, and deeply expressive red wines."
  subregions:
    - id: seaview
      name: Seaview
      known_for: [shiraz, cabernet-sauvignon, grenache]
      notes: "An elevated ridge subregion overlooking the gulf, featuring shallow soils over hard limestone and ancient siltstones that produce powerful, structured, and intensely flavoured red wines."

- id: adelaide-hills
  name: Adelaide Hills
  country: Australia
  climate: maritime
  known_for: [sauvignon-blanc, chardonnay, pinot-noir, shiraz]
  notes: "One of Australia's premier cool-climate wine regions nestled in the Mount Lofty Ranges just east of Adelaide, characterized by high elevations, diverse meso-climates, and ancient soils that produce vibrant, elegant, and finely structured wines."
  subregions:
    - id: piccadilly-valley
      name: Piccadilly Valley
      known_for: [chardonnay, pinot-noir]
      notes: "The cool, misty heartland of the region situated in an ancient amphitheater of hills, featuring weathered sandstone and clay soils over yellow-brown podzolic earth that yield world-class, complex, and mineral-driven sparkling and still wines."

- id: yarra-valley
  name: Yarra Valley
  country: Australia
  climate: maritime
  known_for: [chardonnay, pinot-noir, shiraz, cabernet-sauvignon]
  notes: "Victoria's oldest and most prestigious wine region, nestled along the Yarra River and framed by the Great Dividing Range, renowned for producing world-class, elegant, and complex cool-climate wines."
  subregions:
    - id: upper-yarra
      name: Upper Yarra
      known_for: [chardonnay, pinot-noir]
      notes: "The higher-altitude, cooler sector featuring ancient red volcanic and grey loamy soils, yielding exceptionally refined, highly aromatic, and structure-driven Chardonnays and Pinot Noirs."

- id: tuscany
  name: Tuscany (Toscana)
  country: Italy
  climate: mediterranean
  known_for: [sangiovese, canaiolo, colorino, cabernet-sauvignon, merlot, vermentino, vernaccia]
  notes: "Italy's quintessential cultural and winemaking heartland, sweeping from the Apennine Mountains down to the Tyrrhenian coast. Famed for producing noble, high-acid, and tannin-rich reds built around Sangiovese, alongside pioneering Super Tuscans."
  subregions:

    - id: chianti-classico
      name: Chianti Classico
      known_for: [sangiovese]
      notes: "The historic heartland between Florence and Siena; high-altitude, galestro (schist-clay) soils yield structured, savory reds featuring notes of sour cherry, dried herbs, and earth."

    - id: brunello-di-montalcino
      name: Brunello di Montalcino
      known_for: [sangiovese]
      notes: "Warmer, sun-baked southern hill town producing 100% large-berried Sangiovese Grosso clone, resulting in muscular, complex, and immensely age-worthy wines."

    - id: bolgheri
      name: Bolgheri
      known_for: [cabernet-sauvignon, merlot, cabernet-franc, petit-verdot]
      notes: "Coastal Tuscan icon that pioneered the 'Super Tuscan' movement, replacing traditional local grapes with Bordeaux varieties on sandy, clay, and stony soils."

    - id: vernaccia-di-san-gimignano
      name: San Gimignano
      known_for: [vernaccia]
      notes: "Medieval tower town producing Tuscany's most famous historic white, offering crisp citrus, almond, and distinct mineral character."

- id: veneto
  name: Veneto
  country: Italy
  climate: continental-mediterranean
  known_for: [glera, corvina, rondinella, garganega, pinot-grigio, prosecco]
  notes: "Italy's high-volume and high-prestige powerhouse in the northeast, stretching from the Dolomite mountains to Venice and Lake Garda. Famous for producing the world's most popular sparkling wine (Prosecco), rich dried-grape reds (Amarone), and crisp whites (Soave)."
  subregions:
    - id: valpolicella
      name: Valpolicella
      known_for: [corvina, rondinella, corvinone]
      notes: "Hilly limestone valleys north of Verona; home to fresh daily reds as well as powerhouse Amarone, crafted by air-drying grapes to concentrate sugars and rich flavours."
    - id: prosecco
      name: Prosecco (Conegliano Valdobbiadene)
      known_for: [glera, prosecco]
      notes: "Steep, picturesque hillside vineyards north of Treviso producing aromatic, crisp, and fruit-forward sparkling wines via the tank method (Charmat)."
    - id: soave
      name: Soave
      known_for: [garganega]
      notes: "Volcanic and limestone hills near Verona yielding textured, elegant, and mineral-driven white wines with notes of white peach, almond, and subtle smoke."

- id: gambellara
  name: Gambellara
  country: Italy
  climate: continental-mediterranean
  known_for: [garganega, trebbiano-di-soave, dindarella]
  notes: "A historic white wine appellation in the Veneto region just west of Soave, anchored by ancient basaltic volcanic hills that produce vibrant, mineral-driven, and elegant dry, sparkling, and sweet Recioto wines from the Garganega grape."
  subregions:
    - id: gambellara-classico
      name: Gambellara Classico
      known_for: [garganega]
      notes: "The historic heartland of the zone situated on high-altitude, dark volcanic hillsides of basalt and tuff, yielding structured, almond-scented, and intensely mineral-driven white wines."

- id: alto-adige
  name: Alto Adige (Südtirol)
  country: Italy
  climate: continental
  known_for: [gewurztraminer, pinot-grigio, pinot-bianco, sauvignon-blanc, lagrein, schiava]
  notes: "Italy's northernmost wine region nestled in the dramatic Alpine foothills bordering Austria, where extreme day-night temperature swings, high-altitude sun-drenched valley slopes, and diverse glacial, limestone, and volcanic soils produce crisp, highly aromatic white wines and elegant, structured reds."

- id: sicily
  name: Sicily
  country: Italy
  climate: mediterranean
  known_for: [nero-d-avola, nerello-mascalese, grillo, catarratto, syrah]
  notes: "Italy's sun-drenched Mediterranean island paradise, combining ancient indigenous varieties with volcanic and limestone soils to produce everything from fresh, crisp whites to powerful, expressive reds."
  subregions:
    - id: etna
      name: Etna
      known_for: [nerello-mascalese, nerello-capuccio, carricante]
      notes: "Dramatic high-altitude volcanic slopes surrounding Mount Etna, featuring dark basaltic ash soils that yield ethereal, highly mineral, and elegant Pinot Noir-like reds and vibrant, complex whites."

- id: trentino
  name: Trentino
  country: Italy
  climate: continental
  known_for: [chardonnay, pinot-grigio, teroldego, marzemino, trentodoc]
  notes: "A stunning alpine wine region nestled in northern Italy's Adige River valley, where dramatic mountain peaks shield vineyards from cold northern winds while warm valley breezes and extreme diurnal shifts produce exceptionally crisp, aromatic, and structured wines."
  subregions:
    - id: val-di-cembra
      name: Val di Cembra
      known_for: [chardonnay, muller-thurgau, riesling]
      notes: "A breathtakingly steep, terraced side valley carved by the Avisio River, featuring porphyry volcanic soils and extreme high-altitude vineyards that yield world-class, ultra-refined, and mineral-driven sparkling and white wines."

- id: napa-valley
  name: Napa Valley
  country: United States
  climate: mediterranean
  known_for: [cabernet-sauvignon, chardonnay, sauvignon-blanc]
  notes: "The global benchmark for New World power, ripeness, and luxurious extraction, featuring diverse volcanic and alluvial soils in a compact valley."
  subregions:
    - id: oakville
      name: Oakville
      known_for: [cabernet-sauvignon]
      notes: "The historic sweet spot of the valley floor, delivering lush, iconic, and deeply concentrated Cabernet."

- id: monterey
  name: Monterey
  country: United States
  climate: maritime
  known_for: [chardonnay, pinot-noir, riesling, syrah, cabernet-sauvignon]
  notes: "A premier cool-climate wine region in California shaped by the deep-sea canyon of Monterey Bay, where relentless afternoon ocean winds and morning coastal fogs create one of the longest and coolest growing seasons in the state, yielding vibrant, acid-driven, and highly expressive wines."
  subregions:
    - id: santa-lucia-highlands
      name: Santa Lucia Highlands
      known_for: [chardonnay, pinot-noir, syrah]
      notes: "A breathtaking benchland appellation perched on the eastern slopes of the Santa Lucia Mountains, featuring well-drained granitic soils and intense afternoon winds that produce concentrated, structured, and world-class Chardonnay and Pinot Noir."

- id: central-coast
  name: Central Coast
  country: United States
  climate: maritime
  known_for: [chardonnay, pinot-noir, syrah, cabernet-sauvignon]
  notes: "A massive, diverse AVA stretching from Santa Barbara up to San Francisco, deeply cooled by powerful Pacific ocean breezes."
  subregions:
    - id: paso-robles
      name: Paso Robles
      known_for: [cabernet-sauvignon, syrah, zinfandel]
      notes: "Warmer inland region featuring limestone and calcareous soils, famous for bold, powerful reds and Rhône-style blends."

- id: new-york
  name: New York
  country: United States
  climate: continental
  known_for: [riesling, cabernet-franc, chardonnay, pinot-noir]
  notes: "The premier wine producer of the American Northeast, defined by cool climates, glacial lake influences, and a strong mastery of cold-hardy vinifera and native hybrids."

- id: ohio
  name: Ohio
  country: United States
  climate: continental
  known_for: [catawba, riesling, chardonnay, vidal-blanc, cabernet-franc]
  notes: "One of America's oldest winemaking states, centered along the scenic Lake Erie shoreline and the Ohio River valley, where moderating lake effects, diverse glacial soils, and a rich history of viticulture produce aromatic whites, sparkling styles, and unique native-hybrid wines."
  subregions:
    - id: grand-river-valley
      name: Grand River Valley
      known_for: [riesling, chardonnay, pinot-gris, vidal-blanc]
      notes: "Ohio's premier microclimate appellation situated along the Grand River near Lake Erie, featuring deep sandy-loam and silt soils heavily moderated by lake breezes that yield exceptional, well-balanced cool-climate white wines."

- id: pennsylvania
  name: Pennsylvania
  country: United States
  climate: continental
  known_for: [riesling, cabernet-franc, chardonnay, vidal-blanc, chambourcin]
  notes: "One of America's historic brewing and winemaking cradles, shaped by the rolling ridges of the Appalachian Mountains, diverse microclimates around Lake Erie, and ancient shale-limestone soils that produce vibrant, food-friendly vinifera and hybrid wines."
  subregions:
    - id: lehigh-valley
      name: Lehigh Valley
      known_for: [riesling, cabernet-franc, chardonnay, traminette]
      notes: "A premier viticultural area in eastern Pennsylvania featuring rich limestone-influenced soils and protective mountain ridges that moderate temperatures, yielding exceptionally balanced, aromatic, and mineral-driven white and red wines."

- id: villany
  name: Villány
  country: Hungary
  climate: continental-sub-mediterranean
  known_for: [cabernet-franc, cabernet-sauvignon, merlot, kekfrankos]
  notes: "Hungary's southernmost and warmest wine region, enjoying high sunshine hours and protected hills that create ideal conditions for rich, structured red wines, especially world-class Cabernet Franc."

- id: tokaj
  name: Tokaj
  country: Hungary
  climate: continental
  known_for: [furmint, harslevelu, sarga-muskotaly, zeta]
  notes: "Hungary's legendary historic wine region nestled in the volcanic foothills of the Zemplén Mountains, universally celebrated for producing the world's most famous, complex, and ageworthy botrytized sweet wines (Tokaji Aszú) alongside increasingly acclaimed mineral-driven dry white wines."
  subregions:
    - id: mad
      name: Mád
      known_for: [furmint, harslevelu]
      notes: "One of Tokaj's premier and most historic wine villages, featuring complex volcanic clay, zeolite, and tuff soils that yield deeply concentrated, structured, and intensely mineral-driven dry and sweet Furmint wines."

- id: somlo
  name: Somló
  country: Hungary
  climate: continental
  known_for: [juhfark, harslevelu, furmint, olaszrizling]
  notes: "Hungary's smallest and most unique historic wine region, centered on an isolated volcanic Butte rising dramatically from the Pannonian plain, where basalt soils and ancient cellars produce intensely mineral, full-bodied, and legendarily long-lived white wines."
  subregions:
    - id: somlo-hill
      name: Mount Somló
      known_for: [juhfark, furmint, harslevelu]
      notes: "The steep, terraced slopes of the extinct volcano featuring dark basalt, volcanic ash, and loess soils that impart a striking, smoky minerality and fierce structure to its iconic white wines."

- id: maipo
  name: Maipo Valley
  country: Chile
  climate: mediterranean
  known_for: [cabernet-sauvignon, carmenere, syrah]
  notes: "The historic cradle of Chilean wine situated at the foot of the Andes, renowned for producing structured, elegant Cabernet Sauvignons with signature mint and cassis notes."

- id: maule
  name: Maule Valley
  country: Chile
  climate: mediterranean
  known_for: [carignan, pais, cabernet-sauvignon, carmenere]
  notes: "One of Chile's oldest and largest regions, experiencing a renaissance driven by ancient, dry-farmed bush vines and traditional winemaking."

- id: colchagua
  name: Colchagua Valley
  country: Chile
  climate: mediterranean
  known_for: [carmenere, cabernet-sauvignon, syrah, malbec]
  notes: "One of Chile's most celebrated and acclaimed wine regions, stretching from the Andes down to the Pacific Ocean, renowned for sun-drenched, full-bodied reds."

- id: aconcagua
  name: Aconcagua Valley
  country: Chile
  climate: mediterranean
  known_for: [cabernet-sauvignon, syrah, carmenere, chardonnay]
  notes: "Dramatic Chilean wine region nestled beneath South America's highest peak, stretching from the Andes Mountains down to the cool Pacific coast."

- id: casablanca-valley
  name: Casablanca Valley
  country: Chile
  climate: maritime
  known_for: [sauvignon-blanc, chardonnay, pinot-noir, syrah]
  notes: "A pioneering cool-climate wine region carved into coastal hills between Santiago and the Pacific Ocean, heavily influenced by morning fogs and chilled ocean breezes."

- id: bio-bio
  name: Bío Bío Valley
  country: Chile
  climate: maritime
  known_for: [pinot-noir, chardonnay, riesling, sauvignon-blanc, moscatel]
  notes: "One of Chile's most exciting southern frontier wine regions, centered along the rushing Bío Bío River, characterized by high rainfall, strong winds, and ancient volcanic and alluvial soils that yield vibrant, highly aromatic, and intensely crisp cool-climate wines."

- id: cachapoal
  name: Cachapoal Valley
  country: Chile
  climate: mediterranean
  known_for: [carmenere, cabernet-sauvignon, syrah, chardonnay]
  notes: "A premier northern sub-basin of Chile's Rapel Valley, nestled against the Andes Mountains and celebrated for producing world-class, plush Carménères and structured Cabernet Sauvignons with exceptional depth."
  subregions:
    - id: peumo
      name: Peumo
      known_for: [carmenere, cabernet-sauvignon, sauvignon-blanc]
      notes: "The historic heartland for Carménère in Chile, located along the Cachapoal River with deep alluvial soils and a cooling maritime breeze from the Rapel reservoir, yielding exceptionally complex, velvety, and spice-driven red wines."

- id: limari-valley
  name: Limarí Valley
  country: Chile
  climate: desert
  known_for: [chardonnay, pinot-noir, syrah, sauvignon-blanc]
  notes: "A stunning and unique northern Chilean wine region situated on the edge of the Atacama Desert, heavily cooled by morning coastal fogs (*camanchaca*) and Pacific breezes, and defined by ancient, chalk-rich alluvial soils that impart a distinct, flinty minerality."
  subregions:
    - id: limari-coastal
      name: Coastal Limarí
      known_for: [chardonnay, pinot-noir]
      notes: "The western sector sitting just kilometers from the ocean, featuring unique marine-fossil-laced clay and calcium carbonate soils that produce world-class, intensely linear, saline, and mineral-driven Chardonnays and Pinot Noirs."

- id: coquimbo
  name: Coquimbo Region
  country: Chile
  climate: mediterranean
  known_for: [syrah, chardonnay, pinot-noir, pedro-ximenez, moscatel]
  notes: "Chile's dramatic northernmost wine frontier, where the dry Atacama Desert meets the Pacific Ocean, featuring cool coastal fog, intense sunshine, and ancient rocky soils that yield mineral-driven, vibrant, and highly expressive cool-climate wines."
  subregions:
    - id: elqui-valley
      name: Elqui Valley
      known_for: [syrah, chardonnay, sauvignon-blanc, pedro-ximenez]
      notes: "A stunning, high-altitude valley stretching from the Andes down to the Pacific, featuring rocky alluvial and quartz soils that produce striking, intensely aromatic, and savory cool-climate Syrahs and crisp whites."

- id: sur-chile
  name: South Region (Región del Sur)
  country: Chile
  climate: maritime
  known_for: [pinot-noir, chardonnay, sauvignon-blanc, pais, riesling]
  notes: "Chile's verdant and high-rainfall southern wine heartland, stretching across lush river valleys and ancient volcanic landscapes where cooling maritime influences and historic bush vines produce vibrant, high-acid, and characterful cool-climate wines."
  subregions:
    - id: itata-valley
      name: Itata Valley
      known_for: [pais, cinsault, muscat-of-alexandria, riesling]
      notes: "One of Chile's oldest and most dynamic historic winemaking regions, featuring rolling hills with weathered granitic soils and dry-farmed bush vines that yield rustic, juicy, and expressive natural-style red and white wines."

- id: western-cape
  name: Western Cape
  country: South Africa
  climate: mediterranean-maritime
  known_for: [chenin-blanc, cabernet-sauvignon, syrah, pinotage, sauvignon-blanc, chardonnay]
  notes: "South Africa's preeminent wine macro-region shaped by the converging Atlantic and Indian oceans, ancient and diverse geological formations including Table Mountain sandstone and weathered granite, and a Mediterranean climate that fosters both legendary structured reds and exceptionally vibrant, complex whites."
  subregions:
    - id: stellenbosch
      name: Stellenbosch
      known_for: [cabernet-sauvignon, syrah, chenin-blanc, merlot]
      notes: "The historic heart of South African winemaking nestled among dramatic mountain amphitheatres, featuring deep weathered granite and shale soils that yield world-class, structured Cabernet Sauvignon, powerful blends, and refined whites."

- id: orange-river
  name: Orange River
  country: South Africa
  climate: continental
  known_for: [colombard, chenin-blanc, chardonnay, shiraz, souzao]
  notes: "South Africa's northernmost and most sprawling wine region, stretching along the banks of the mighty Orange River in a desert landscape, where abundant sunshine and controlled drip-irrigation yield fresh, accessible, and fruit-forward table wines as well as exceptional fortified styles."
  subregions:
    - id: upington
      name: Upington
      known_for: [colombard, chenin-blanc, shiraz]
      notes: "The primary hub of the region featuring deep alluvial and sandy soils alongside intense sunlight, producing large volumes of vibrant, easy-drinking white and red wines."

- id: olifants-river
  name: Olifants River
  country: South Africa
  climate: mediterranean
  known_for: [chenin-blanc, colombard, sauvignon-blanc, pinotage, shiraz]
  notes: "A diverse and historic wine region in South Africa's Western Cape stretching along the banks of the Olifants River, where cooling Atlantic breezes from the nearby coast moderate a warm, arid climate, producing fresh, vibrant, and accessible wines."

- id: robertson
  name: Robertson
  country: South Africa
  climate: mediterranean
  known_for: [chardonnay, sauvignon-blanc, shiraz, cabernet-sauvignon, chenin-blanc]
  notes: "Known as the 'Valley of Vines and Roses', Robertson is one of South Africa's premier limestone-rich wine valleys, situated along the Breede River where cool mountain breezes and chalky soils produce world-class, elegant Chardonnays and structured reds."
  subregions:
    - id: bonniemvale
      name: Bonnievale
      known_for: [chardonnay, shiraz, cabernet-sauvignon]
      notes: "A warm yet river-cooled subregion featuring rich alluvial and lime-infused soils that yield plush, fruit-forward, and generously textured red and white wines."

- id: paarl
  name: Paarl
  country: South Africa
  climate: mediterranean
  known_for: [chenin-blanc, shiraz, cabernet-sauvignon, pinotage, chardonnay]
  notes: "One of South Africa's historic and largest wine-producing regions, nestled beneath massive granite domes along the Berg River, renowned for producing bold, rich, and deeply structured red and white wines."
  subregions:
    - id: simonsberg-paarl
      name: Simonsberg-Paarl
      known_for: [cabernet-sauvignon, shiraz, merlot, chardonnay]
      notes: "The prestigious mountain ward flanking the Simonsberg massif, featuring well-drained decomposed granite and weathered sandstone soils that yield world-class, elegant, and age-worthy red wines."

- id: breedekloof
  name: Breedekloof
  country: South Africa
  climate: mediterranean
  known_for: [chenin-blanc, sauvignon-blanc, pinotage, shiraz, chardonnay]
  notes: "A dynamic and picturesque wine region situated in a dramatic mountain basin along the Breede River east of Worcester, characterized by dramatic shale and sandstone soils, high diurnal temperature ranges, and a pioneering spirit that champions world-class, expressive Chenin Blancs."
  subregions:
    - id: slanghoek
      name: Slanghoek
      known_for: [chenin-blanc, chardonnay, sauvignon-blanc, pinotage]
      notes: "A stunning, secluded valley cradled by the Slanghoek Mountains, featuring weathered granite and alluvial soils swept by cooling mountain winds, yielding exceptionally aromatic, fresh, and complex white and red wines."

- id: swartland
  name: Swartland
  country: South Africa
  climate: mediterranean
  known_for: [chenin-blanc, syrah, grenache, carignan, cinsault]
  notes: "South Africa's rebel wine heartland, located north of Cape Town, famed for its rugged landscapes, old dry-farmed bush vines, and ancient decomposed granite and shale soils that yield avant-garde, intensely concentrated, and deeply expressive natural-leaning wines."
  subregions:
    - id: malmesbury
      name: Malmesbury
      known_for: [chenin-blanc, syrah, cinsault]
      notes: "The historic southern core of the region characterized by rolling wheat and vineyard hills, featuring deep, weathered Malmesbury shale soils that produce structured, savory, and powerfully complex red and white wines."

- id: franschhoek
  name: Franschhoek Valley
  country: South Africa
  climate: mediterranean
  known_for: [semillon, chardonnay, sauvignon-blanc, syrah, cabernet-sauvignon]
  notes: "One of South Africa's oldest and most picturesque wine valleys, cradled by the dramatic Drakenstein and Franschhoek Mountains, featuring ancient sandstone and weathered granite soils that produce rich, elegant, and historically acclaimed wines."
  subregions:
    - id: franschhoek-mountain-slopes
      name: Franschhoek Mountain Slopes
      known_for: [semillon, syrah, chardonnay]
      notes: "Steep, elevated vineyard sites benefiting from cool mountain shadows, high diurnal temperature variation, and poor, well-draining soils that yield concentrated, highly structured, and age-worthy white and red wines."

- id: elgin
  name: Elgin
  country: South Africa
  climate: maritime
  known_for: [chardonnay, sauvignon-blanc, pinot-noir, syrah]
  notes: "South Africa's coolest wine region, situated in a high-altitude inland plateau surrounded by dramatic mountain ranges and cooled by Atlantic breezes from nearby Walker Bay, producing exceptionally elegant, balanced, and vibrant wines."
  subregions:
    - id: elgin-valley-plateau
      name: Elgin Valley Plateau
      known_for: [chardonnay, pinot-noir, sauvignon-blanc]
      notes: "The central basin featuring weathered Bokkeveld shale and clay soils, characterized by high diurnal shifts and cool mist cover that yield world-class, highly aromatic, and complex cool-climate wines."

- id: ontario
  name: Ontario
  country: Canada
  climate: continental
  known_for: [riesling, chardonnay, pinot-noir, cabernet-franc, icewine]
  notes: "Canada's premier wine powerhouse, heavily moderated by the Great Lakes and the Niagara Escarpment, producing world-class cool-climate vinifera and legendary sweet Icewines."

- id: british-columbia
  name: British Columbia
  country: Canada
  climate: continental-desert
  known_for: [riesling, pinot-noir, chardonnay, merlot, syrah]
  notes: "A dramatic Canadian wine region nestled between mountain ranges, featuring glacier-fed lakes and a rain-shadow desert climate ideal for cool-climate and structured reds."
  subregions:
    - id: okanagan-valley
      name: Okanagan Valley
      known_for: [riesling, pinot-noir, merlot, chardonnay]
      notes: "A stunning 150-mile long desert-to-cool-climate valley boasting glacial benchlands that produce vibrant, aromatic whites and textured reds."

- id: coonawarra
  name: Coonawarra
  country: Australia
  climate: maritime
  known_for: [cabernet-sauvignon, shiraz, chardonnay, riesling]
  notes: "Australia's legendary red wine region famous for its narrow strip of unique terra rossa soil over limestone, delivering world-class, minty, and structured Cabernet Sauvignon."

- id: hebei
  name: Hebei
  country: China
  climate: continental-monsoon
  known_for: [cabernet-sauvignon, merlot, marselan, chardonnay, longyan]
  notes: "Northern China's historic viticultural heartland surrounding Beijing, bounded by mountain ranges and shaped by unique microclimates where vines must be manually buried underground each winter to survive the freezing cold."

- id: xinjiang
  name: Xinjiang
  country: China
  climate: continental
  known_for: [cabernet-sauvignon, merlot, chardonnay, syrah, riesling]
  notes: "China's vast western frontier wine region boasting intense sunlight, extreme diurnal temperature ranges, and desert oasis soils, producing deeply colored, plush, and fruit-forward wines."

- id: ningxia
  name: Ningxia
  country: China
  climate: continental
  known_for: [cabernet-sauvignon, marselan, merlot, syrah, chardonnay]
  notes: "China's undisputed flagship wine region sheltered by the Helan Mountains and irrigated by the Yellow River, producing world-class, structured, and richly concentrated red wines."

- id: shandong
  name: Shandong
  country: China
  climate: maritime-continental
  known_for: [cabernet-sauvignon, chardonnay, marselan, riesling]
  notes: "China's coastal pioneer wine region anchored by the Bohai Sea, famous for long, temperate growing seasons and sandy, gravelly soils that yield elegant, fruit-forward, and balanced wines."

- id: jiaodong
  name: Jiaodong Peninsula
  country: China
  climate: monsoon
  known_for: [cabernet-sauvignon, chardonnay, riesling, cabernet-gernischt]
  notes: "China's historical birthplace of modern commercial winemaking, jutting out into the Yellow Sea and featuring rolling hills, sandy-gravelly soils, and maritime influences that yield elegant, food-friendly, and aromatic wines."

- id: mornag
  name: Mornag
  country: Tunisia
  climate: mediterranean
  known_for: [carignan, syrah, grenache, mourvedre, chardonnay, muscat-of-alexandria]
  notes: "Tunisia's premier and largest wine appellation nestled on sunny hillsides near the Mediterranean coast, boasting ancient Carthaginian roots and producing structured reds, fresh whites, and fragrant rosés."

- id: sidi-salem
  name: Sidi Salem
  country: Tunisia
  climate: mediterranean
  known_for: [carignan, syrah, mourvedre, grenache]
  notes: "A distinguished Tunisian appellation located just south of Tunis, featuring clay-limestone and alluvial soils with pocket gravels that produce structured reds and refreshing rosés."
  subregions:
    - id: selian
      name: Selian
      known_for: [carignan, syrah, chardonnay]
      notes: "A notable estate-driven sector within the appellation known for crafting expressive, low-intervention red and white wines that balance Mediterranean warmth with crisp structure."

- id: medea
  name: Médéa
  country: Algeria
  climate: mediterranean
  known_for: [carignan, cinsault, grenache, syrah, chardonnay]
  notes: "Historic Algerian mountain wine region located in the Tell Atlas south of Algiers, benefiting from high-altitude plateaus and cool evening temperatures that impart freshness and structure to its robust wines."
  subregions:
    - id: dahra
      name: Dahra
      known_for: [carignan, cinsault, grenache]
      notes: "Rugged, sun-drenched hillslopes overlooking valleys, characterized by limestone and clay soils that produce rich, earthy, and deeply colored Mediterranean red and rosé wines."

- id: berkane
  name: Berkane
  country: Morocco
  climate: mediterranean
  known_for: [cabernet-sauvignon, merlot, syrah, grenache, cinsault]
  notes: "Morocco's premier northeastern wine region situated in the fertile Triffa Plain near the Mediterranean coast and the Atlas foothills, blessed with abundant sunshine and cooling sea breezes that yield rich, harmonious, and elegant wines."
  subregions:
    - id: beni-snassen
      name: Beni Snassen
      known_for: [cabernet-sauvignon, syrah, grenache]
      notes: "Mountainous slopes framing the plain, featuring clay-limestone soils that provide natural drainage and cooling elevation, producing structured, complex, and deeply expressive red wines."

- id: beni-mtir
  name: Beni M'Tir
  country: Morocco
  climate: mediterranean
  known_for: [cabernet-sauvignon, merlot, syrah, carignan, grenache]
  notes: "An esteemed Moroccan appellation nestled in the foothills of the Atlas Mountains near the historic city of Meknès, benefiting from high-altitude plateaus, warm sunshine, and cool nights that yield structured, aromatic, and fruit-forward wines."
  subregions:
    - id: meknese-plateau
      name: Meknès Plateau
      known_for: [cabernet-sauvignon, merlot, syrah]
      notes: "Elevated clay-limestone terroir enjoying significant diurnal temperature shifts, producing balanced, elegant red wines with rich dark fruit and spice characteristics."

- id: guerrouane
  name: Guerrouane
  country: Morocco
  climate: continental-mediterranean
  known_for: [carignan, cinsault, grenache, syrah, cabernet-sauvignon]
  notes: "One of Morocco's historic and distinguished registered appellations (AOG) situated in the fertile region near Meknès, benefiting from elevated plains, intense North African sunshine, and cooling continental influences that craft robust, food-friendly red and rosé wines."
  subregions:
    - id: guerrouane-sud
      name: Guerrouane Sud
      known_for: [carignan, syrah, grenache]
      notes: "The sun-baked southern sector featuring clay-limestone and stony soils that yield concentrated, spicy, and deeply structured Mediterranean-style red wines."

- id: marmara
  name: Marmara Region
  country: Turkey
  climate: maritime-continental
  known_for: [papazkarasi, adakarasi, cabernet-sauvignon, chardonnay, merlot]
  notes: "Turkey's historic bridge between Europe and Asia, surrounded by the Marmara, Black, and Aegean seas, featuring rolling hills and moderated maritime climates that yield elegant, food-friendly, and aromatic wines."
  subregions:
    - id: thrace
      name: Thrace (Trakya)
      known_for: [cabernet-sauvignon, merlot, chardonnay, papazkarasi]
      notes: "The European part of the region, benefiting from cooling breezes and well-drained clay-limestone soils, renowned as modern Turkey's premier hub for structured red blends and expressive whites."

- id: stajerska-slovenija
  name: Štajerska Slovenija
  country: Slovenia
  climate: continental
  known_for: [sipon, riesling, sauvignon-blanc, chardonnay, traminec]
  notes: "The premier subregion of Podravje in northeastern Slovenia, characterized by dramatic steep slopes, cool continental-alpine conditions, and nutrient-rich marl soils that produce world-class aromatic and mineral-driven white wines."
  subregions:
    - id: jeruzalem-ormoz
      name: Jeruzalem-Ormož
      known_for: [sipon, sauvignon-blanc, traminec, riesling]
      notes: "The breathtaking ridge-top wine district overlooking the Pannonian plain, featuring high-altitude terraced vineyards and chalky marl soils that yield intensely aromatic, precise, and vibrant white wines."

- id: tokajska
  name: Tokajská (Slovakia)
  country: Slovakia
  climate: continental
  known_for: [furmint, harslevelu, yellow-muscat, zeta]
  notes: "The Slovakian extension of the historic Tokaj wine region, situated in the southeastern corner of the country where volcanic tuff hills, microclimates driven by local rivers, and noble rot combine to produce legendary, mineral-rich botrytized sweet wines and striking dry whites."
  subregions:
    - id: velka-trna
      name: Veľká Tŕňa
      known_for: [furmint, harslevelu]
      notes: "One of the core historical winemaking villages of the Slovakian Tokaj, featuring steep south-facing slopes with volcanic clay and rhyolite tuff soils that yield deep, structured, and honeyed sweet and dry wines."


- id: medjimurje
  name: Međimurje
  country: Croatia
  climate: continental
  known_for: [pusipel, sauvignon-blanc, riesling, chardonnay, yellow-muscat]
  notes: "Croatia's northernmost wine region nestled in the gentle, rolling hills between the Mura and Drava rivers, where cool continental winds and ancient mineral-rich soils produce vibrant, highly aromatic, and crisp white wines, anchored by the signature Pušipel grape."
  subregions:
    - id: sveti-urban
      name: Sveti Urban
      known_for: [pusipel, sauvignon-blanc, yellow-muscat]
      notes: "The premier ridge-top viticultural zone of Međimurje featuring steep, sun-exposed slopes with sandy-clay and marl soils that yield exceptionally fresh, mineral-driven, and expressive cool-climate white wines."

- id: valais
  name: Valais
  country: Switzerland
  climate: continental
  known_for: [chasselas, pinot-noir, petite-arvine, heida, cornalin]
  notes: "Switzerland's premier and sun-drenched wine region, stretching along the deep, dramatic valley of the upper Rhône River framed by towering alpine peaks, where extreme dry conditions, foehn winds, and steep terraced soils produce a vast array of unique, terroir-driven indigenous and classic grape varieties."
  subregions:
    - id: central-valais
      name: Central Valais
      known_for: [chasselas, pinot-noir, petite-arvine, syrah]
      notes: "The sun-baked heart of the region spanning from Sierre to Martigny, featuring steep, south-facing slopes of ancient glacial moraine, slate, and limestone that yield powerful, structured reds and intensely aromatic, mineral-rich whites."

- id: vaud
  name: Vaud
  country: Switzerland
  climate: continental
  known_for: [chasselas, pinot-noir, gamay, gamaret, chardonnay]
  notes: "Switzerland's second-largest wine-producing canton, sweeping along the northern shores of Lake Geneva and the rolling hills of the Vaudois Alps, where reflective lake waters, gentle southern slopes, and limestone-rich soils produce world-class, elegant Chasselas and refined red wines."
  subregions:
    - id: lavaux
      name: Lavaux
      known_for: [chasselas, pinot-noir]
      notes: "A breathtaking UNESCO World Heritage site featuring dramatic, steep stone-terraced vineyards plunging down to Lake Geneva, where triple-sun exposure (from the sun, sky, and lake) and deep gravelly limestone soils yield intensely mineral, structured, and age-worthy Chasselas."


- id: geneva
  name: Geneva (Genève)
  country: Switzerland
  climate: continental
  known_for: [chasselas, gamay, pinot-noir, chardonnay, gamaret]
  notes: "Switzerland's third-largest wine-producing canton, situated around Lake Geneva and bordered by France, where temperate lacustrine microclimates, diverse glacial moraine soils, and a strong pioneering spirit yield fresh, modern, and highly expressive red and white wines."
  subregions:
    - id: mandement
      name: Le Mandement
      known_for: [chasselas, gamay, pinot-noir, gamaret]
      notes: "The largest contiguous wine-producing area in Switzerland, nestled between the Rhône river and the Jura foothills, featuring deep gravelly-clay soils that produce well-structured, fruit-forward reds and crisp, elegant whites."

- id: niederosterreich
  name: Lower Austria (Niederösterreich)
  country: Austria
  climate: continental
  known_for: [gruner-veltliner, riesling, zweigelt, pinot-noir, chardonnay]
  notes: "Austria's largest and most important wine region, stretching along the Danube and its tributaries north and west of Vienna, where dramatic thermal swings between warm Pannonian days and cool northern forest nights, combined with ancient loess, primary rock, and limestone soils, produce world-class, precise, and intensely mineral-driven white and red wines."
  subregions:
    - id: wachau
      name: Wachau
      known_for: [gruner-veltliner, riesling]
      notes: "The breathtaking steep-terraced valley along the Danube featuring primary crystalline rock (gneiss and granite) soils and dramatic river-reflected solar warmth that yield some of the world's most powerful, complex, and age-worthy dry white wines."

- id: vienna
  name: Vienna (Wien)
  country: Austria
  climate: continental
  known_for: [gruner-veltliner, riesling, weissburgunder, chardonnay, gemischter-satz]
  notes: "A unique global capital of winemaking where thriving vineyards are planted directly within the city limits, sheltered by the Vienna Woods and warmed by the Pannonian basin, producing fresh, aromatic white wines anchored by the traditional field blend known as Wiener Gemischter Satz."
  subregions:
    - id: nussberg
      name: Nussberg
      known_for: [riesling, weissburgunder, gemischter-satz]
      notes: "Vienna's premier steep hillside vineyard zone overlooking the Danube, featuring shallow limestone, marl, and volcanic soils that yield mineral-driven, elegant, and exceptionally complex white wines."

- id: south-west-romania
  name: South-West Romania (Oltenia and Banat)
  country: Romania
  climate: continental
  known_for: [feteasca-neagra, cabernet-sauvignon, merlot, riesling-italian, sauvignon-blanc]
  notes: "A historic and sun-drenched wine macro-region stretching across the lower Danube and the southern slopes of the Southern Carpathians, where protected microclimates, rolling hills, and rich clay-loam and alluvial soils foster robust, full-bodied red wines alongside aromatic and well-structured whites."
  subregions:
    - id: dejalu
      name: Dealu Mare (Extension/Oltenia Hills)
      known_for: [feteasca-neagra, cabernet-sauvignon, novac, neagra-de-dragasani]
      notes: "The picturesque and sun-exposed hills of Oltenia (centering around Drăgășani) featuring well-drained clay and sandy soils that yield exceptional indigenous red varieties like Novac and Negru de Drăgășani alongside powerful international reds."

- id: muntenia
  name: Muntenia (and Dobruja)
  country: Romania
  climate: continental
  known_for: [feteasca-neagra, cabernet-sauvignon, merlot, chardonnay, sauvignon-blanc, riesling]
  notes: "A prolific Romanian wine region stretching across the southern plains and rolling hills beneath the shadow of the Carpathians, where abundant sunshine, moderate rainfall, and fertile clay-loam and limestone soils produce rich, structured red wines and expressive, aromatic whites."
  subregions:
    - id: dealu-mare
      name: Dealu Mare
      known_for: [feteasca-neagra, cabernet-sauvignon, merlot, pinot-noir]
      notes: "Romania's premier and most celebrated red wine appellation situated along the southern sub-Carpathian hills, featuring sun-drenched south-facing slopes and well-drained clay soils that yield legendary, deeply concentrated, and velvety Fetească Neagră and powerful international blends."

- id: black-sea-bulgaria
  name: Black Sea Region (Bulgaria)
  country: Bulgaria
  climate: continental-maritime
  known_for: [dimyat, rkatsiteli, chardonnay, sauvignon-blanc, misket]
  notes: "Bulgaria's principal coastal wine macro-region stretching along the dramatic western shores of the Black Sea, where warm, long autumns and sea-tempered breezes create an ideal microclimate for fresh, aromatic, and mineral-driven white wines."
  subregions:
    - id: varna
      name: Varna
      known_for: [dimyat, chardonnay, sauvignon-blanc, riesling]
      notes: "The northern coastal subregion characterized by sandy-clay soils and a strong marine influence that yields exceptionally crisp, high-acid white wines with vibrant floral and citrus profiles."

- id: danube-plain
  name: Danube Plain (Northern Bulgaria)
  country: Bulgaria
  climate: continental
  known_for: [mavrud, gamza, cabernet-sauvignon, chardonnay, muscat-ottonel]
  notes: "Bulgaria's expansive northern wine region stretching from the southern banks of the Danube River to the northern slopes of the Balkan Mountains, where hot, sunny summers and fertile loess, clay, and limestone soils produce robust, fruit-forward red wines and refreshing, aromatic whites."
  subregions:
    - id: suhindol
      name: Suhindol
      known_for: [gamza, cabernet-sauvignon, merlot]
      notes: "A historic winemaking heartland within the central Danube Plain featuring rolling limestone hills and well-drained soils that yield elegant, earthy red wines led by the indigenous Gamza grape."